name: oposicontrol-admin

services:
  backend:
    build:
      context: ..
      dockerfile: deploy/backend/Dockerfile
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      APP_ENV: production
      APP_VERSION: ${APP_VERSION:-local}
      SUPABASE_URL: ${SUPABASE_URL:?SUPABASE_URL is required}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:?SUPABASE_PUBLISHABLE_KEY is required}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:?SUPABASE_SECRET_KEY is required}
      SUPABASE_JWT_AUDIENCE: ${SUPABASE_JWT_AUDIENCE:-authenticated}
      OPOSIBOTS_PASSWORD_RECOVERY_REDIRECT_URL: "${OPOSIBOTS_PASSWORD_RECOVERY_REDIRECT_URL:-oposibots://auth/reset-password}"
      APPLE_CLIENT_ID: "${APPLE_CLIENT_ID:-}"
      APPLE_CLIENT_SECRET: "${APPLE_CLIENT_SECRET:-}"
      TRUST_PROXY_HEADERS: "${TRUST_PROXY_HEADERS:-true}"
      SUPABASE_BUCKET_EXAM_COVERS: exam-covers
      SUPABASE_BUCKET_EXAM_RESOURCES: exam-resources
      # NEWS=FROZEN: alias server-side temporal; retirar en el plan específico de Noticias.
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SECRET_KEY:?SUPABASE_SECRET_KEY is required}
      OPOSICONTROL_ENABLE_BACKEND_RESTART: "false"
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8080/health/live"]
      interval: 15s
      timeout: 3s
      retries: 4
      start_period: 20s
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - backend_internal

  caddy:
    image: caddy:2.11.2-alpine
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:?ADMIN_DOMAIN is required}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    networks:
      - backend_internal

networks:
  backend_internal:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
