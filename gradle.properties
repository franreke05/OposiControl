#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M

#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
# Desactivado: el sync "por fases" de Android Studio con includeBuild("build-logic")
# inicializa el build cache controller dos veces en la misma sesión del daemon y
# revienta con "Build cache controller already set" (IllegalStateException en
# LifecycleAwareBuildCacheControllerFactory). Solo pasa en el sync del IDE, nunca
# en ./gradlew por línea de comandos. Si se confirma que el sync ya no falla,
# puede quedarse así o revisar si una versión más nueva de Gradle lo arregla.
org.gradle.caching=false

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true