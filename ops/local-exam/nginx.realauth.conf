# EX16: la pasarela local imita las rutas de Supabase que Ktor usa: /rest/v1 (PostgREST), /storage/v1 (Storage) y el JWKS
# de /auth/v1 (clave EC local con la que `up.mjs` firma los JWT de los usuarios de prueba).
server {
  listen 80;
  client_max_body_size 60m;

  location = /auth/v1/.well-known/jwks.json {
    default_type application/json;
    alias /srv/jwks.json;
  }

  # REAL AUTH (up.mjs --real-auth): every /auth/v1/* (incl. GET /user) goes to the real GoTrue container; the JWKS above is the same key GoTrue signs with.
  location ^~ /auth/v1/ {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $gotrue http://auth:9999;
    rewrite ^/auth/v1/(.*)$ /$1 break;
    proxy_pass $gotrue;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_connect_timeout 3s;
  }

  location /rest/v1/ {
    proxy_pass http://rest:3000/;
    proxy_set_header Host $host;
  }

  # Fixture RECURSO LENTO (EX_LENTO, pregunta f8...01): sus bytes firmados se sirven a 32 KB/s.
  location ~ ^/storage/v1/object/sign/recursos-pregunta/preguntas/f8000000-0000-4000-8000-000000000001/ {
    limit_rate 32k;
    rewrite ^/storage/v1/(.*)$ /$1 break;
    proxy_pass http://storage:5000;
    proxy_set_header Host $host;
  }

  location /storage/v1/ {
    proxy_pass http://storage:5000/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Prefix /storage/v1;
  }
}
