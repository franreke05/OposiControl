# EX16: la pasarela local imita las rutas de Supabase que Ktor usa: /rest/v1 (PostgREST), /storage/v1 (Storage) y el JWKS
# de /auth/v1 (clave EC local con la que `up.mjs` firma los JWT de los usuarios de prueba).
server {
  listen 80;
  client_max_body_size 60m;

  location = /auth/v1/.well-known/jwks.json {
    default_type application/json;
    alias /srv/jwks.json;
  }

  # E5-I01: GoTrue NO existe en el stack. `GET /auth/v1/user` se responde desde los claims del JWT local verificado (auth-stub.js).
  location = /auth/v1/user {
    js_content authstub.user;
  }

  # V1 (J6, SOLO local): el resto de /auth/v1/* (signup, resend, verify, token, logout, recover) lo sirve gotrue-stub.mjs, un proceso del
  # HOST (puerto gotrueStub de stack-config.mjs) que se niega a arrancar fuera de APP_ENV local|test. Si no esta arrancado, estas rutas dan 502.
  # $gotrue_stub lo fija njs (auth-stub.js stubUrl) desde /srv/gotrue-stub-url.txt, que up.mjs escribe por stack: una copia aislada usa SU stub.
  location ^~ /auth/v1/ {
    resolver 127.0.0.11 valid=10s ipv6=off;
    proxy_pass $gotrue_stub;
    proxy_set_header Host $host;
    proxy_connect_timeout 3s;
  }

  location /rest/v1/ {
    proxy_pass http://rest:3000/;
    proxy_set_header Host $host;
  }

  # Fixture RECURSO LENTO (EX_LENTO, pregunta f8...01): sus bytes firmados se sirven a 32 KB/s.
  location ~ ^/storage/v1/object/sign/recursos-pregunta/preguntas/f8000000-0000-4000-8000-000000000001/ {
    limit_rate 32k;
    rewrite ^/storage/v1/(.*)$ /$1 break;
    proxy_pass http://storage:5000;
    proxy_set_header Host $host;
  }

  location /storage/v1/ {
    proxy_pass http://storage:5000/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Prefix /storage/v1;
  }
}
