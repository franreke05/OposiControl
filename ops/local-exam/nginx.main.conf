# EX16: nginx.conf principal de la pasarela LOCAL: igual que el de la imagen, mas el modulo njs para el stub de
# /auth/v1/user (auth-stub.js, E5-I01). Las rutas estan en nginx.conf (conf.d/default.conf).
load_module modules/ngx_http_js_module.so;

worker_processes 1;
error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /var/log/nginx/access.log;
  sendfile on;
  keepalive_timeout 65;
  js_import authstub from /etc/nginx/njs/auth-stub.js;
  js_set $gotrue_stub authstub.stubUrl;   # nginx.conf: /auth/v1/* -> this stack's host GoTrue stub
  include /etc/nginx/conf.d/*.conf;
}
