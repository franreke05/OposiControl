# Alertas del stack de produccion. SOLO metricas que existen hoy en el codigo:
#   - ktor_http_server_requests_seconds_{count,sum,bucket}  (MicrometerMetrics, PrometheusMetrics.kt; etiquetas status, route, method)
#   - jvm_memory_used_bytes / jvm_memory_max_bytes, jvm_gc_pause_seconds_*, jvm_threads_live_threads (binders JVM de Micrometer)
#   - up (Prometheus)
#   - upstream_supabase_up (gauge de la sonda de readiness, PrometheusMetrics.kt) y upstream_response_wire_bytes_total
# NO existen aun (hueco documentado en docs/engineering/RUNTIME_DECISIONS.md): metrica de latencia/errores hacia Supabase,
# gauge de readiness, metricas del limitador/Valkey, metricas de worker. No se alerta sobre ellas.
groups:
  - name: ktor-availability
    rules:
      - alert: KtorInstanceDown
        expr: up{job="ktor"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Instancia Ktor {{ $labels.replica }} ({{ $labels.profile }}) no responde al scrape"
          description: "up=0 durante 1 minuto. Revisar `docker compose ps` y los logs del contenedor."

      - alert: KtorBotPoolDegraded
        expr: sum(up{job="ktor", profile="bot"}) < 2
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "El pool bot funciona con menos de 2 replicas"
          description: "Sin redundancia en OposiBot: una replica mas que caiga deja la API de la app sin servicio."

  - name: ktor-http
    rules:
      - record: profile:ktor_http_requests:rate5m
        expr: sum by (profile) (rate(ktor_http_server_requests_seconds_count{route!="/metrics"}[5m]))

      - record: profile:ktor_http_errors_5xx:ratio5m
        expr: |
          sum by (profile) (rate(ktor_http_server_requests_seconds_count{status=~"5..", route!="/metrics"}[5m]))
          /
          sum by (profile) (rate(ktor_http_server_requests_seconds_count{route!="/metrics"}[5m]))

      - record: profile:ktor_http_request_duration_seconds:p95_5m
        expr: histogram_quantile(0.95, sum by (profile, le) (rate(ktor_http_server_requests_seconds_bucket{route!="/metrics"}[5m])))

      - record: profile:ktor_http_request_duration_seconds:p99_5m
        expr: histogram_quantile(0.99, sum by (profile, le) (rate(ktor_http_server_requests_seconds_bucket{route!="/metrics"}[5m])))

      - alert: KtorHigh5xxRate
        expr: profile:ktor_http_errors_5xx:ratio5m > 0.05 and profile:ktor_http_requests:rate5m > 0.2
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Mas del 5 % de respuestas 5xx en el perfil {{ $labels.profile }}"
          description: "Ratio 5xx {{ $value | humanizePercentage }} en 5 minutos (con trafico minimo de 0.2 req/s para evitar ruido)."

      - alert: KtorHighLatencyP95
        # Las subidas/importaciones de control son legitimamente lentas (hasta 120 s): umbral solo para el perfil bot.
        expr: profile:ktor_http_request_duration_seconds:p95_5m{profile="bot"} > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "p95 de latencia > 1 s en el pool bot"
          description: "p95 {{ $value | humanizeDuration }} durante 10 minutos."

      - alert: KtorHighLatencyP99
        expr: profile:ktor_http_request_duration_seconds:p99_5m{profile="bot"} > 5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "p99 de latencia > 5 s en el pool bot"
          description: "p99 {{ $value | humanizeDuration }} durante 10 minutos (el limite de Ktor hacia Supabase es de 20 s)."

  - name: ktor-jvm
    rules:
      - alert: KtorJvmHeapPressure
        expr: |
          sum by (replica, profile) (jvm_memory_used_bytes{job="ktor", area="heap"})
          /
          sum by (replica, profile) (jvm_memory_max_bytes{job="ktor", area="heap"}) > 0.9
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Heap de {{ $labels.replica }} por encima del 90 % durante 10 minutos"
          description: "Riesgo de OutOfMemoryError (la JVM sale por -XX:+ExitOnOutOfMemoryError y el contenedor se reinicia)."

      - alert: KtorJvmLongGcPauses
        expr: sum by (replica) (rate(jvm_gc_pause_seconds_sum{job="ktor"}[5m])) > 0.1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.replica }} dedica mas del 10 % del tiempo a pausas de GC"
          description: "Heap demasiado justo para la carga: revisar -XX:MaxRAMPercentage y el limite de memoria."

      # Plan Pro de Supabase (desde 2026-10-22): 250 GB de trafico de salida por ciclo (unos 8,3 GB al dia, 347 MB a la hora).
      # Con el plan gratuito eran 5 GB (incidente 2026-10-10). Si cambia el plan, ajustar estos umbrales y
      # SUPABASE_MONTHLY_EGRESS_LIMIT_GB del backend. La metrica cuenta los bytes de respuesta que el backend recibe de
      # Supabase tal como viajan (comprimidos); no incluye lo que los clientes descargan directo con URLs firmadas.
      - alert: SupabaseEgressHigh
        expr: sum(increase(upstream_response_wire_bytes_total[1h])) > 300e6
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "El backend ha recibido mas de 300 MB de Supabase en una hora"
          description: "Cerca del presupuesto por hora de la cuota de 250 GB al mes. Buscar la llamada repetitiva (sum by (replica, target))."

      - alert: SupabaseEgressDailyBudgetExceeded
        expr: sum(increase(upstream_response_wire_bytes_total[24h])) > 7.5e9
        for: 30m
        labels:
          severity: critical
        annotations:
          summary: "Mas de 7,5 GB recibidos de Supabase en 24 horas"
          description: "Por encima del 90 % del presupuesto diario de la cuota de 250 GB al mes: se cobrara el exceso o Supabase puede restringir el proyecto."

      # Incidente 2026-10-10: Supabase estuvo 11 horas sin responder sin que nadie lo viera.
      - alert: SupabaseUnreachable
        expr: max(upstream_supabase_up) == 0
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "Ninguna replica consigue hablar con Supabase desde hace 3 minutos"
          description: "La API responde /health/live pero toda ruta con datos falla. Mirar el panel de Supabase (cuota, estado del proyecto)."

  # Pagos de tienda (re-auditoria OposiControl 2026-10-19, NEW-5): bandeja de avisos de Google Play / App Store. Gauges de StorePaymentRoutes.kt
  # (StoreInboxMetrics), publicados por el trabajo de reconciliacion de las replicas bot. max() porque las dos replicas leen la misma base.
  - name: store-payments
    rules:
      - alert: StoreInboxPendingStuck
        expr: max(store_inbox_oldest_seconds{estado="pendiente"}) > 3600
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Avisos de tienda pendientes de procesar desde hace mas de una hora"
          description: "La bandeja reintenta con espera creciente; mirar ultimo_error en tienda_bandeja (API de Google caida, credenciales, base)."

      # N4-2 (re-auditoria Control ronda 4): los avisos retenidos por G1 / D8 apagados se publican como estado="retenido_decision" (estado
      # esperado mientras el propietario no encienda el credito real o las suscripciones): no cuentan aqui ni en StoreInboxPendingStuck.
      - alert: StoreInboxRefundsRetained
        expr: max(store_inbox_backlog{estado="retenido"}) > 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Reembolsos de tienda guardados con PAYMENTS_REFUNDS_ENABLED apagado"
          description: "No se pierden: se aplican al activar los reembolsos. Decidir con el propietario (D2) o activarlos."

      - alert: StoreInboxDeadLetter
        expr: max(store_inbox_backlog{estado="muerto"}) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Avisos de tienda en dead letter"
          description: "Superaron PAYMENTS_STORE_DEAD_LETTER_ATTEMPTS. Revisar y reencolar (RPC requeue de la bandeja de tienda)."

      - alert: StoreInboxOrphansOld
        expr: max(store_inbox_oldest_seconds{estado=~"huerfano_reembolso|huerfano_reversion"}) > 86400
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Reembolsos o reversiones de tienda sin compra desde hace mas de un dia"
          description: "La compra no ha llegado (o no se verifico). El trabajo los re-enlaza en cuanto exista; si no llega, revision manual."

      # N3-6 (re-auditoria Control ronda 3): pagos de tienda encendidos (store_payments_enabled = 1, lo publica el arranque) pero el trabajo no
      # publica la bandeja (PAYMENTS_STORE_JOB_SECONDS=0, trabajo caido): sin esta regla las demas alertas de la bandeja nunca saltarian.
      - alert: StoreInboxMetricsAbsent
        expr: absent(store_inbox_backlog) and on() (max(store_payments_enabled) == 1)
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Pagos de tienda activos sin metricas de la bandeja"
          description: "El trabajo de reconciliacion no publica store_inbox_backlog. Revisar PAYMENTS_STORE_JOB_SECONDS y los logs del trabajo. Dead letter: decision N3-6 (docs/payments/DECISIONS_PENDING.md)."

      # N5-1 (re-auditoria Control ronda 5): Get Notification History lleva mas de 100 paginas desde el cursor; el token de la pagina siguiente esta
      # guardado y cada vuelta del trabajo lee 100 mas. Si sigue a medias 6 horas, algo no avanza (token rechazado en bucle, API caida).
      - alert: StoreAppleHistoryIncomplete
        expr: max(store_inbox_history_incomplete) == 1
        for: 6h
        labels:
          severity: warning
        annotations:
          summary: "Recuperacion de avisos de App Store (Notification History) a medias desde hace 6 horas"
          description: "tienda_sondeo guarda un paginationToken que no se termina de leer. Revisar los logs 'store apple history' del trabajo y la App Store Server API."
