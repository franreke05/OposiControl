# Throwaway stub for the k6 smoke ONLY. Answers every route with small static JSON; it is not the backend.
events {}
http {
  access_log off;
  server {
    listen 8080;
    default_type application/json;
    location = /v1/auth/login   { return 200 '{"accessToken":"a.b.c","refreshToken":"r","expiresAtEpochSeconds":1,"user":{}}'; }
    location = /v1/auth/refresh { return 200 '{"accessToken":"a.b.c","refreshToken":"r","expiresAtEpochSeconds":1,"user":{}}'; }
    location ~ ^/api/v1/app/examenes/[^/]+/intentos$ { return 200 '{"intento":{"id":"00000000-0000-4000-8000-0000000000a1"},"reanudado":false}'; }
    location ~ ^/api/v1/app/intentos/[^/]+/preguntas$ { return 200 '{"items":[{"preguntaId":"00000000-0000-4000-8000-0000000000c1","opciones":[{"id":"00000000-0000-4000-8000-0000000000d1","letra":"A","texto":"x"}]}]}'; }
    location / { return 200 '{"items":[],"nextCursor":null}'; }
  }
}
