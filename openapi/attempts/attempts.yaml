# ATTEMPTS contracts (FROZEN): D2-03, D2-05..D2-12, D2-65 (CF-02 D2_65_OPENAPI_READY = YES).
# CF-01: the canonical start is POST /api/v1/app/examenes/{examId}/intentos. There is no
# resume endpoint (re-POST returns the open attempt with reanudado=true, or rehydrate with
# D2-07 + D2-08); pause/resume stays BLOCKED_PRODUCT_DECISION on DEC-014. No legacy start
# route or alias is described here. Implementation of these routes is SLICE 3.
components:
  pathItems:
    ExamAttempts:
      post:
        operationId: startOrResumeExamAttempt
        summary: 'Start an exam attempt or return the open one'
        tags: [attempts]
        x-contract-id: D2-03
        x-implementation: TARGET
        x-slice: 3
        x-roles: [USER]
        x-pagination: NONE
        x-idempotency: REQUIRED
        x-error-codes: [VALIDATION, IDEMPOTENCY_KEY_REQUIRED, IDEMPOTENCY_KEY_INVALID, UNAUTHENTICATED, EXAM_LOCKED, SPECIALTY_TYPE_NOT_ALLOWED, EXAM_NOT_FOUND, EXAM_EMPTY, IDEMPOTENCY_KEY_IN_PROGRESS, IDEMPOTENCY_KEY_REUSED, RATE_LIMITED]
        description: 'FA28 (V1 demo): modo DEMO is LIVE. With modo DEMO the server creates an attempt that contains ONLY the exam questions flagged as demo by Control (always the same set, frozen at start; esDemo true on the attempt): nothing beyond them is ever served, a demo never counts for Nota media, ranking, streak, quota, purchases or the first answer, and it needs the DEMO access state (exam with demo available, capability on, same specialty gate; otherwise the usual EXAM_LOCKED / EXAM_NOT_FOUND / SPECIALTY_TYPE_NOT_ALLOWED). A user who already has access and sends DEMO gets a normal attempt. Starts of demo attempts are limited per user and per IP (429 RATE_LIMITED). Original text follows. One transaction: lazy deadline check, CheckExamAccess, partial unique index (usuario_id, examen_id) WHERE estado=en_progreso plus INSERT ON CONFLICT, then preguntas_intento is frozen. Concurrent or new-key calls converge on the single open attempt (200, reanudado=true). A prior finalizado or abandonado attempt means a new attempt (retake). usuario_id is never accepted from the client. The attempt is tied to the exam and to that exam specialty (returned as intento.especialidadId), never to the user current specialty (DEC-002). DEMO semantics are an open exam_engine question.'
        security:
          - bearerAuth: []
        parameters:
          - $ref: '../common/identifiers.yaml#/components/parameters/ExamIdPath'
          - $ref: '../common/idempotency.yaml#/components/parameters/IdempotencyKeyRequired'
        requestBody:
          required: false
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttemptStartRequest'
        responses:
          '200':
            description: 'An en_progreso attempt already exists for (usuario, examen); reanudado=true.'
            headers:
              Idempotent-Replayed:
                $ref: '../common/idempotency.yaml#/components/headers/IdempotentReplayed'
              Cache-Control:
                $ref: '#/components/headers/NoStore'
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/AttemptStartResponse'
          '201':
            description: 'Attempt created; reanudado=false.'
            headers:
              Location:
                description: '/api/v1/app/intentos/{id}'
                required: true
                schema:
                  type: string
              Idempotent-Replayed:
                $ref: '../common/idempotency.yaml#/components/headers/IdempotentReplayed'
              Cache-Control:
                $ref: '#/components/headers/NoStore'
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/AttemptStartResponse'
          '400':
            $ref: '../common/errors.yaml#/components/responses/BadRequest'
            description: 'VALIDATION, IDEMPOTENCY_KEY_REQUIRED or IDEMPOTENCY_KEY_INVALID.'
          '401':
            $ref: '../common/errors.yaml#/components/responses/Unauthenticated'
          '403':
            $ref: '../common/errors.yaml#/components/responses/Forbidden'
            description: 'EXAM_LOCKED (details.accessState) or SPECIALTY_TYPE_NOT_ALLOWED.'
          '404':
            $ref: '../common/errors.yaml#/components/responses/NotFound'
            description: 'EXAM_NOT_FOUND (also draft or archived).'
          '409':
            $ref: '../common/errors.yaml#/components/responses/Conflict'
            description: 'EXAM_EMPTY or IDEMPOTENCY_KEY_IN_PROGRESS.'
          '422':
            $ref: '../common/errors.yaml#/components/responses/UnprocessableEntity'
            description: 'IDEMPOTENCY_KEY_REUSED.'
          '429':
            $ref: '../common/errors.yaml#/components/responses/RateLimited'
    DailyChallenge:
      get:
        operationId: getTodayDailyChallenge
        summary: 'Get today daily challenge'
        tags: [attempts]
        x-contract-id: D2-05
        x-implementation: TARGET
        x-slice: 3
        x-roles: [USER]
        x-pagination: NONE
        x-idempotency: NONE
        x-error-codes: [UNAUTHENTICATED, INTERNAL, UPSTREAM_ERROR]
        description: 'FA29: SUPERSEDED for the V1 app by D3-16 (GET /api/v1/app/retos/hoy, openapi/engagement/engagement.yaml): the V1 challenge is not an exam attempt. This operation stays documented for the legacy route only. The date is resolved server-side in the fixed product timezone (DEC-006 fixes the value only).'
        security:
          - bearerAuth: []
        responses:
          '200':
            description: 'Today challenge and participation, each null when absent.'
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/DailyChallengeView'
          '401':
            $ref: '../common/errors.yaml#/components/responses/Unauthenticated'
          '500':
            $ref: '../common/errors.yaml#/components/responses/Internal'
          '502':
            $ref: '../common/errors.yaml#/components/responses/UpstreamError'
    DailyChallengeAttempts:
      post:
        operationId: startOrResumeDailyChallengeAttempt
        summary: 'Start the daily challenge attempt or return the existing one'
        tags: [attempts]
        x-contract-id: D2-06
        x-implementation: TARGET
        x-slice: 3
        x-roles: [USER]
        x-pagination: NONE
        x-idempotency: OPTIONAL
        x-error-codes: [IDEMPOTENCY_KEY_INVALID, UNAUTHENTICATED, CHALLENGE_NOT_FOUND, CHALLENGE_NOT_ACTIVE, CHALLENGE_ALREADY_COMPLETED, RATE_LIMITED]
        description: 'FA29: SUPERSEDED by D3-17/D3-18 (engagement.yaml); the V1 challenge is answered with PUT /api/v1/app/retos/{retoId}/respuestas/{preguntaId}, not through an attempt. Natural key: one participation per (usuario, reto); returns the existing attempt. The Idempotency-Key header is optional (a malformed key is 400 IDEMPOTENCY_KEY_INVALID).'
        security:
          - bearerAuth: []
        parameters:
          - $ref: '../common/identifiers.yaml#/components/parameters/RetoIdPath'
          - $ref: '../common/idempotency.yaml#/components/parameters/IdempotencyKeyOptional'
        responses:
          '200':
            description: 'Existing attempt; reanudado=true.'
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/AttemptStartResponse'
          '201':
            description: 'Attempt created; reanudado=false.'
            headers:
              Location:
                description: '/api/v1/app/intentos/{id}'
                required: true
                schema:
                  type: string
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/AttemptStartResponse'
          '400':
            $ref: '../common/errors.yaml#/components/responses/BadRequest'
            description: 'IDEMPOTENCY_KEY_INVALID.'
          '401':
            $ref: '../common/errors.yaml#/components/responses/Unauthenticated'
          '404':
            $ref: '../common/errors.yaml#/components/responses/NotFound'
            description: 'CHALLENGE_NOT_FOUND.'
          '409':
            $ref: '../common/errors.yaml#/components/responses/Conflict'
            description: 'CHALLENGE_NOT_ACTIVE or CHALLENGE_ALREADY_COMPLETED.'
          '429':
            $ref: '../common/errors.yaml#/components/responses/RateLimited'
    Attempt:
      get:
        operationId: getAttempt
        summary: 'Get an attempt and its grid'
        tags: [attempts]
        x-contract-id: D2-07
        x-implementation: TARGET
        x-slice: 3
        x-roles: [USER]
        x-pagination: NONE
        x-idempotency: NONE
        x-error-codes: [VALIDATION, UNAUTHENTICATED, ATTEMPT_NOT_FOUND, RATE_LIMITED]
        description: 'Owner only; a foreign attempt is 404. May lazily finalize (TIMEOUT) first. Grid bounded by the attempt question count. Per-user read limit (E2-S01, amendment 2026-10-14).'
        security:
          - bearerAuth: []
        parameters:
          - $ref: '../common/identifiers.yaml#/components/parameters/AttemptIdPath'
        responses:
          '200':
            description: 'Attempt state.'
            headers:
              Cache-Control:
                $ref: '#/components/headers/NoStore'
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/AttemptView'
          '400':
            $ref: '../common/errors.yaml#/components/responses/BadRequest'
          '401':
            $ref: '../common/errors.yaml#/components/responses/Unauthenticated'
          '404':
            $ref: '../common/errors.yaml#/components/responses/NotFound'
            description: 'ATTEMPT_NOT_FOUND (also not owner).'
          '429':
            $ref: '../common/errors.yaml#/components/responses/RateLimited'
    AttemptQuestions:
      get:
        operationId: listAttemptQuestions
        summary: 'List the frozen questions of an attempt'
        tags: [attempts]
        x-contract-id: D2-08
        x-implementation: TARGET
        x-slice: 3
        x-roles: [USER]
        x-pagination: CURSOR
        x-idempotency: NONE
        x-error-codes: [VALIDATION, INVALID_CURSOR, UNAUTHENTICATED, ATTEMPT_NOT_FOUND, RATE_LIMITED, DAILY_LIMIT_REACHED]
        description: 'FA28: on plans with a daily limit (benefit limite_preguntas_24h) a page that would reveal NEW questions beyond the rolling 24 h limit answers 429 DAILY_LIMIT_REACHED with Retry-After (questions already revealed in the window, demo attempts and exams held through purchase, gift or quota are exempt). Owner only, no entitlement re-check (the frozen set is the scope). Keyset posicion. Content comes from the immutable question revision bound at start (amendment 2026-10-14). No solutions or explanations; V1 resource METADATA only (recursos; bytes via D2-66): the only correction carried is the one of the user own answer (respuesta.esCorrecta, respuesta.opcionCorrectaId; DEC-015), for an open and for a finished attempt alike.'
        security:
          - bearerAuth: []
        parameters:
          - $ref: '../common/identifiers.yaml#/components/parameters/AttemptIdPath'
          - $ref: '../common/pagination.yaml#/components/parameters/Cursor'
          - $ref: '../common/pagination.yaml#/components/parameters/LimitAttemptQuestions'
        responses:
          '200':
            description: 'Question page.'
            content:
              application/json:
                schema:
                  allOf:
                    - $ref: '../common/pagination.yaml#/components/schemas/CursorPageEnvelope'
                    - type: object
                      required: [items]
                      properties:
                        items:
                          type: array
                          items:
                            $ref: '#/components/schemas/AttemptQuestion'
          '400':
            $ref: '../common/errors.yaml#/components/responses/BadRequest'
            description: 'VALIDATION or INVALID_CURSOR.'
          '401':
            $ref: '../common/errors.yaml#/components/responses/Unauthenticated'
          '404':
            $ref: '../common/errors.yaml#/components/responses/NotFound'
            description: 'ATTEMPT_NOT_FOUND.'
          '429':
            $ref: '../common/errors.yaml#/components/responses/RateLimited'
    AttemptAnswer:
      put:
        operationId: recordAttemptAnswer
        summary: 'Record or revise the answer to a question'
        tags: [attempts]
        x-contract-id: D2-09
        x-implementation: TARGET
        x-slice: 3
        x-roles: [USER]
        x-pagination: NONE
        x-idempotency: REQUIRED
        x-error-codes: [VALIDATION, IDEMPOTENCY_KEY_REQUIRED, IDEMPOTENCY_KEY_INVALID, UNAUTHENTICATED, ATTEMPT_NOT_FOUND, ATTEMPT_NOT_IN_PROGRESS, ATTEMPT_EXPIRED, ANSWER_LOCKED, REVISION_CONFLICT, IDEMPOTENCY_KEY_IN_PROGRESS, QUESTION_NOT_IN_ATTEMPT, OPTION_NOT_IN_QUESTION, IDEMPOTENCY_KEY_REUSED, RATE_LIMITED]
        description: 'A replay returns the stored body with Idempotent-Replayed true. The same option with a new key is a no-op; a different option takes the revision path or 409 REVISION_CONFLICT (details.currentRevision). primera_* are immutable, final_* mutable. Via record_answer plus trigger. DEC-015 (decided 2026-10-13): answering reveals esCorrecta and opcionCorrectaId in the response, for the three exam types; a given answer stays locked (409 ANSWER_LOCKED); a skip reveals nothing and can still be answered once later.'
        security:
          - bearerAuth: []
        parameters:
          - $ref: '../common/identifiers.yaml#/components/parameters/AttemptIdPath'
          - $ref: '../common/identifiers.yaml#/components/parameters/PreguntaIdPath'
          - $ref: '../common/idempotency.yaml#/components/parameters/IdempotencyKeyRequired'
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnswerRequest'
        responses:
          '200':
            description: 'Answer recorded.'
            headers:
              Idempotent-Replayed:
                $ref: '../common/idempotency.yaml#/components/headers/IdempotentReplayed'
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/AnswerResult'
          '400':
            $ref: '../common/errors.yaml#/components/responses/BadRequest'
            description: 'VALIDATION, IDEMPOTENCY_KEY_REQUIRED or IDEMPOTENCY_KEY_INVALID.'
          '401':
            $ref: '../common/errors.yaml#/components/responses/Unauthenticated'
          '404':
            $ref: '../common/errors.yaml#/components/responses/NotFound'
            description: 'ATTEMPT_NOT_FOUND.'
          '409':
            $ref: '../common/errors.yaml#/components/responses/Conflict'
            description: 'ATTEMPT_NOT_IN_PROGRESS, ATTEMPT_EXPIRED, ANSWER_LOCKED, REVISION_CONFLICT (details.currentRevision) or IDEMPOTENCY_KEY_IN_PROGRESS.'
          '422':
            $ref: '../common/errors.yaml#/components/responses/UnprocessableEntity'
            description: 'QUESTION_NOT_IN_ATTEMPT, OPTION_NOT_IN_QUESTION or IDEMPOTENCY_KEY_REUSED.'
          '429':
            $ref: '../common/errors.yaml#/components/responses/RateLimited'
    AttemptFinish:
      post:
        operationId: finishAttempt
        summary: 'Finish an attempt'
        tags: [attempts]
        x-contract-id: D2-10
        x-implementation: TARGET
        x-slice: 3
        x-roles: [USER]
        x-pagination: NONE
        x-idempotency: OPTIONAL
        x-error-codes: [VALIDATION, IDEMPOTENCY_KEY_INVALID, UNAUTHENTICATED, ATTEMPT_NOT_FOUND, ATTEMPT_ABANDONED, RATE_LIMITED]
        description: 'Idempotent: an already finalizado attempt returns the stored result (200). One RPC with FOR UPDATE. Empty body.'
        security:
          - bearerAuth: []
        parameters:
          - $ref: '../common/identifiers.yaml#/components/parameters/AttemptIdPath'
          - $ref: '../common/idempotency.yaml#/components/parameters/IdempotencyKeyOptional'
        responses:
          '200':
            description: 'Result (D2-12 schema).'
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/AttemptResult'
          '400':
            $ref: '../common/errors.yaml#/components/responses/BadRequest'
          '401':
            $ref: '../common/errors.yaml#/components/responses/Unauthenticated'
          '404':
            $ref: '../common/errors.yaml#/components/responses/NotFound'
            description: 'ATTEMPT_NOT_FOUND.'
          '409':
            $ref: '../common/errors.yaml#/components/responses/Conflict'
            description: 'ATTEMPT_ABANDONED.'
          '429':
            $ref: '../common/errors.yaml#/components/responses/RateLimited'
    AttemptAbandon:
      post:
        operationId: abandonAttempt
        summary: 'Abandon an attempt'
        tags: [attempts]
        x-contract-id: D2-11
        x-implementation: TARGET
        x-slice: 3
        x-roles: [USER]
        x-pagination: NONE
        x-idempotency: NATURAL
        x-error-codes: [VALIDATION, UNAUTHENTICATED, ATTEMPT_NOT_FOUND, ATTEMPT_ALREADY_FINISHED, RATE_LIMITED]
        description: 'Idempotent by state: an already abandonado attempt returns 204 with no new abandonos_examen row. Elapsed time is computed server-side; the inactividad reason is reserved server-only pending DEC-014.'
        security:
          - bearerAuth: []
        parameters:
          - $ref: '../common/identifiers.yaml#/components/parameters/AttemptIdPath'
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AbandonRequest'
        responses:
          '204':
            description: 'Abandoned.'
          '400':
            $ref: '../common/errors.yaml#/components/responses/BadRequest'
          '401':
            $ref: '../common/errors.yaml#/components/responses/Unauthenticated'
          '404':
            $ref: '../common/errors.yaml#/components/responses/NotFound'
            description: 'ATTEMPT_NOT_FOUND.'
          '409':
            $ref: '../common/errors.yaml#/components/responses/Conflict'
            description: 'ATTEMPT_ALREADY_FINISHED.'
          '429':
            $ref: '../common/errors.yaml#/components/responses/RateLimited'
    AttemptResult:
      get:
        operationId: getAttemptResult
        summary: 'Get the result of a finished attempt'
        tags: [attempts]
        x-contract-id: D2-12
        x-implementation: TARGET
        x-slice: 3
        x-roles: [USER]
        x-pagination: NONE
        x-idempotency: NONE
        x-error-codes: [UNAUTHENTICATED, ATTEMPT_NOT_FOUND, ATTEMPT_NOT_FINISHED, RATE_LIMITED]
        description: 'Owner only, finalizado only. Correct options come from the bound question revision (amendment 2026-10-14). Immutable; private cache allowed. Bounded by the attempt question count.'
        security:
          - bearerAuth: []
        parameters:
          - $ref: '../common/identifiers.yaml#/components/parameters/AttemptIdPath'
        responses:
          '200':
            description: 'Result.'
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/AttemptResult'
          '401':
            $ref: '../common/errors.yaml#/components/responses/Unauthenticated'
          '404':
            $ref: '../common/errors.yaml#/components/responses/NotFound'
            description: 'ATTEMPT_NOT_FOUND.'
          '409':
            $ref: '../common/errors.yaml#/components/responses/Conflict'
            description: 'ATTEMPT_NOT_FINISHED.'
          '429':
            $ref: '../common/errors.yaml#/components/responses/RateLimited'
    AttemptReview:
      get:
        operationId: getAttemptReview
        summary: 'Review a finished attempt question by question'
        tags: [attempts]
        x-contract-id: D2-65
        x-implementation: TARGET
        x-slice: 3
        x-roles: [USER]
        x-pagination: CURSOR
        x-idempotency: NONE
        x-error-codes: [VALIDATION, INVALID_CURSOR, UNAUTHENTICATED, ATTEMPT_NOT_FOUND, ATTEMPT_NOT_FINISHED, RATE_LIMITED]
        description: 'Available only when estado=finalizado (motivoFin USER or TIMEOUT; the lazy TIMEOUT runs first). Owner by JWT sub only, no entitlement re-check. Items in attempt order (preguntas_intento.posicion), keyset posicion, bounded by attempt size (<= 200). Read-only (repeating is D2-03). Per-question status comes from the snapshot frozen at finish; statement, options, correct option and resource refs come from the immutable question revision bound at start (amendment 2026-10-14; attempts frozen before it read live content). Explanation stays null (DEC-025, single policy); resources are the V1 media of the revision (owner decision 2026-10-14). Totals, nota and band stay in D2-12.'
        security:
          - bearerAuth: []
        parameters:
          - $ref: '../common/identifiers.yaml#/components/parameters/AttemptIdPath'
          - $ref: '../common/pagination.yaml#/components/parameters/Cursor'
          - $ref: '../common/pagination.yaml#/components/parameters/LimitApp'
        responses:
          '200':
            description: 'Review page.'
            headers:
              Cache-Control:
                $ref: '#/components/headers/NoStore'
            content:
              application/json:
                schema:
                  allOf:
                    - $ref: '../common/pagination.yaml#/components/schemas/CursorPageEnvelope'
                    - type: object
                      required: [attempt, items]
                      properties:
                        attempt:
                          $ref: '#/components/schemas/ReviewAttempt'
                        items:
                          type: array
                          items:
                            $ref: '#/components/schemas/ReviewItem'
          '400':
            $ref: '../common/errors.yaml#/components/responses/BadRequest'
            description: 'VALIDATION or INVALID_CURSOR.'
          '401':
            $ref: '../common/errors.yaml#/components/responses/Unauthenticated'
          '404':
            $ref: '../common/errors.yaml#/components/responses/NotFound'
            description: 'ATTEMPT_NOT_FOUND (also not owner).'
          '409':
            $ref: '../common/errors.yaml#/components/responses/Conflict'
            description: 'ATTEMPT_NOT_FINISHED (en_progreso or abandonado).'
          '429':
            $ref: '../common/errors.yaml#/components/responses/RateLimited'
    AttemptResourceAccess:
      get:
        operationId: getAttemptResourceAccess
        summary: 'Temporary access to the bytes of a resource of the attempt'
        tags: [attempts]
        x-contract-id: D2-66
        x-implementation: TARGET
        x-slice: 3
        x-roles: [USER]
        x-pagination: NONE
        x-idempotency: NONE
        x-error-codes: [VALIDATION, UNAUTHENTICATED, ATTEMPT_NOT_FOUND, RESOURCE_NOT_FOUND, RATE_LIMITED, UPSTREAM_UNAVAILABLE]
        description: 'Amendment 2026-10-14 (owner decision: resources V1 image and audio, video extensible, PDF out). Owner by JWT sub only; the resource must belong to a question revision bound to THIS attempt (a bare resourceId opens nothing); no entitlement re-check (the attempt exists only if D2-03 passed the access policy). Ktor authorizes, Storage serves the bytes through a short-lived signed URL (never persisted, never the internal path). Any attempt state (open, finished, abandoned).'
        security:
          - bearerAuth: []
        parameters:
          - $ref: '../common/identifiers.yaml#/components/parameters/AttemptIdPath'
          - name: recursoId
            in: path
            required: true
            schema:
              $ref: '../common/identifiers.yaml#/components/schemas/Uuid'
        responses:
          '200':
            description: 'Signed URL and its expiry.'
            headers:
              Cache-Control:
                $ref: '#/components/headers/NoStore'
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/AttemptResourceAccess'
          '400':
            $ref: '../common/errors.yaml#/components/responses/BadRequest'
          '401':
            $ref: '../common/errors.yaml#/components/responses/Unauthenticated'
          '404':
            $ref: '../common/errors.yaml#/components/responses/NotFound'
            description: 'ATTEMPT_NOT_FOUND (also not owner) or RESOURCE_NOT_FOUND (not in a revision bound to this attempt, or outside V1).'
          '429':
            $ref: '../common/errors.yaml#/components/responses/RateLimited'
          '503':
            $ref: '../common/errors.yaml#/components/responses/UpstreamUnavailable'
            description: 'UPSTREAM_UNAVAILABLE: Storage could not sign (object missing or Storage down). Retryable.'
  headers:
    NoStore:
      description: 'no-store'
      required: true
      schema:
        type: string
        enum: [no-store]
  schemas:
    AttemptEstado:
      type: string
      description: 'pausado is reserved for DEC-014; clients tolerate unknown values.'
      enum: [en_progreso, finalizado, abandonado]
    MotivoFin:
      type: string
      enum: [USER, TIMEOUT]
    AttemptStartRequest:
      type: object
      required: []
      additionalProperties: false
      properties:
        modo:
          type: string
          enum: [NORMAL, DEMO]
          default: NORMAL
    Attempt:
      type: object
      description: 'D2-07 intento shape.'
      required: [id, origen, tipoExamen, estado, iniciadoEn, serverNow, totalPreguntas, respondidas, sinResponder]
      properties:
        esDemo:
          type: boolean
          description: 'FA28: true for a demo attempt (only the demo-flagged questions). Absent = false.'
        id:
          $ref: '../common/identifiers.yaml#/components/schemas/Uuid'
        origen:
          $ref: '../common/identifiers.yaml#/components/schemas/AttemptOrigin'
        examenId:
          type: [string, 'null']
          format: uuid
        especialidadId:
          type: [string, 'null']
          format: uuid
          description: 'Specialty of the EXAM the attempt belongs to, fixed at start (DEC-002). Never the specialty the user has now: changing the profile specialty does not reinterpret past attempts. null only when the attempt has no exam.'
        tipoExamen:
          $ref: '../common/identifiers.yaml#/components/schemas/TipoExamen'
        estado:
          $ref: '#/components/schemas/AttemptEstado'
        motivoFin:
          oneOf:
            - $ref: '#/components/schemas/MotivoFin'
            - type: 'null'
        iniciadoEn:
          $ref: '../common/identifiers.yaml#/components/schemas/Instant'
        deadline:
          type: [string, 'null']
          format: date-time
        serverNow:
          $ref: '../common/identifiers.yaml#/components/schemas/Instant'
        totalPreguntas:
          type: integer
          minimum: 0
        respondidas:
          type: integer
          minimum: 0
        correctas:
          type: [integer, 'null']
          minimum: 0
        falladas:
          type: [integer, 'null']
          minimum: 0
        sinResponder:
          type: integer
          minimum: 0
        ultimaPreguntaPosicion:
          type: [integer, 'null']
          minimum: 1
    AttemptGridItem:
      type: object
      required: [posicion, preguntaId, revision, estado]
      properties:
        posicion:
          type: integer
          minimum: 1
        preguntaId:
          $ref: '../common/identifiers.yaml#/components/schemas/Uuid'
        revision:
          type: integer
          minimum: 0
        estado:
          type: string
          description: 'DEC-015 (decided 2026-10-13): an answered question is correcta or incorrecta as soon as it is answered, also before finish, for the three exam types. A skipped or untouched question is sin_responder; anulada wins over any answer. reserva_no_utilizada (FA31) exists ONLY in the grid of a FINISHED attempt: while the attempt is open an unused reserve is not in the grid, not in the pages, not answerable and its media is not served (404). respondida only when the correction of an answered question is not available.'
          enum: [sin_responder, respondida, correcta, incorrecta, anulada, reserva_no_utilizada]
        rol:
          type: string
          enum: [PRINCIPAL, RESERVA]
          description: 'FA31: absent = PRINCIPAL.'
        sustituyeA:
          type: integer
          minimum: 1
          description: 'FA31: activated reserve only: posicion of the annulled question it replaces.'
    AttemptView:
      type: object
      required: [intento, grid]
      properties:
        intento:
          $ref: '#/components/schemas/Attempt'
        grid:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/AttemptGridItem'
    AttemptStartResponse:
      type: object
      required: [intento, reanudado]
      properties:
        intento:
          $ref: '#/components/schemas/Attempt'
        reanudado:
          type: boolean
    DailyChallengeView:
      type: object
      required: []
      properties:
        reto:
          type: [object, 'null']
          required: [id, fecha, titulo, objetivoPreguntas, aciertosNecesarios, terminaEn]
          properties:
            id:
              $ref: '../common/identifiers.yaml#/components/schemas/Uuid'
            fecha:
              $ref: '../common/identifiers.yaml#/components/schemas/LocalDate'
            titulo:
              type: string
            descripcion:
              type: [string, 'null']
            objetivoPreguntas:
              type: integer
              minimum: 1
            aciertosNecesarios:
              type: integer
              minimum: 0
            recompensaPuntos:
              type: [integer, 'null']
            terminaEn:
              $ref: '../common/identifiers.yaml#/components/schemas/Instant'
        participacion:
          type: [object, 'null']
          required: [progreso, aciertos, completado, superado]
          properties:
            intentoId:
              type: [string, 'null']
              format: uuid
            progreso:
              type: integer
              minimum: 0
            aciertos:
              type: integer
              minimum: 0
            completado:
              type: boolean
            superado:
              type: boolean
    QuestionOption:
      type: object
      required: [id, letra, texto]
      properties:
        id:
          $ref: '../common/identifiers.yaml#/components/schemas/Uuid'
        letra:
          $ref: '../common/identifiers.yaml#/components/schemas/OptionLetter'
        texto:
          type: string
    AttemptQuestion:
      type: object
      x-entity: pregunta
      required: [posicion, preguntaId, codigoPregunta, tipoPregunta, titulo, anulada, opciones]
      properties:
        posicion:
          type: integer
          minimum: 1
        preguntaId:
          $ref: '../common/identifiers.yaml#/components/schemas/Uuid'
        codigoPregunta:
          type: string
        tipoPregunta:
          $ref: '../common/identifiers.yaml#/components/schemas/TipoPregunta'
        titulo:
          type: string
        anulada:
          type: boolean
        rol:
          type: string
          enum: [PRINCIPAL, RESERVA]
          description: 'FA31: block of the question in an official exam. Absent = PRINCIPAL. A RESERVA appears in an open attempt only when it was ACTIVATED at start (REEMPLAZO_POR_RESERVA); unused reserves are never served while the attempt is open.'
        sustituyeA:
          type: integer
          minimum: 1
          description: 'FA31: only on an activated reserve: the posicion of the annulled main question it replaces.'
        opciones:
          type: array
          items:
            $ref: '#/components/schemas/QuestionOption'
        respuesta:
          type: [object, 'null']
          required: [revision, respondidaEn]
          properties:
            opcionId:
              type: [string, 'null']
              format: uuid
            revision:
              type: integer
              minimum: 0
            respondidaEn:
              $ref: '../common/identifiers.yaml#/components/schemas/Instant'
            esCorrecta:
              type: [boolean, 'null']
              description: 'DEC-015: whether the selected option is correct. Present only when opcionId is not null and the question is not annulled; null or absent for a skip.'
            opcionCorrectaId:
              type: [string, 'null']
              format: uuid
              description: 'DEC-015: the correct option, under the same condition as esCorrecta. May be null while esCorrecta is present.'
        recursos:
          type: array
          description: 'Amendment 2026-10-14: V1 resources of the bound revision; absent when none.'
          items:
            $ref: '#/components/schemas/AttemptResource'
    RichText:
      type: object
      description: 'FA38: styled text of an explanation (razonado), produced by the strict server-side grammar (E1-V1-MARKUP-CONTRACT.md). Render it as TEXT (never as HTML): paragraphs ("p") and bullet items ("li"), optional alignment per block, and spans with a closed set of styles. Sizes are TOKENS (map them to the design system text styles), colors are names or #RRGGBB. The plain text is always in the sibling "razonamiento" string.'
      required: [v, blocks]
      additionalProperties: false
      properties:
        v:
          type: integer
          enum: [1]
        blocks:
          type: array
          maxItems: 200
          items:
            type: object
            required: [k, spans]
            additionalProperties: false
            properties:
              k:
                type: string
                enum: [p, li]
              a:
                type: string
                enum: [left, center, right, justify]
              spans:
                type: array
                minItems: 1
                maxItems: 2000
                items:
                  type: object
                  required: [text]
                  additionalProperties: false
                  properties:
                    text:
                      type: string
                      minLength: 1
                      maxLength: 20000
                    bold:
                      type: boolean
                      enum: [true]
                    italic:
                      type: boolean
                      enum: [true]
                    underline:
                      type: boolean
                      enum: [true]
                    strike:
                      type: boolean
                      enum: [true]
                    color:
                      type: string
                      pattern: '^(black|gray|red|orange|yellow|green|blue|purple|#[0-9A-F]{6})$'
                    size:
                      type: string
                      enum: [xs, sm, md, lg, xl]
    AttemptResource:
      type: object
      description: 'Amendment 2026-10-14. A V1 media resource of the immutable question revision bound to the attempt. Metadata only: bytes via D2-66. Canonical mapping: resourceId = id, type = tipo, access = D2-66.'
      required: [id, tipo, titulo, version]
      properties:
        id:
          $ref: '../common/identifiers.yaml#/components/schemas/Uuid'
        tipo:
          type: string
          enum: [imagen, audio, video]
        titulo:
          type: string
        mimeType:
          type: [string, 'null']
        version:
          type: string
          description: 'Stable 16-hex token of the stored object (cache key). Bytes of a resourceId are never rewritten.'
        sizeBytes:
          type: [integer, 'null']
          minimum: 0
        durationMs:
          type: [integer, 'null']
          minimum: 0
          description: 'Audio/video duration measured at ingest; null until ingest computes it.'
        envelope:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/AudioEnvelope'
    AudioEnvelope:
      type: object
      description: 'Computed ONCE at ingest. One UInt8 sample (0..255) per stepMs: RMS of the window centred on k*stepMs, normalised to the resource maximum; base64.'
      required: [stepMs, samples]
      properties:
        stepMs:
          type: integer
          minimum: 10
          maximum: 1000
        samples:
          type: string
          format: byte
    AttemptResourceAccess:
      type: object
      required: [url, expiresAt, version]
      properties:
        url:
          type: string
          format: uri
          description: 'Short-lived signed URL; no Authorization header needed. Ask again when it expires.'
        expiresAt:
          $ref: '../common/identifiers.yaml#/components/schemas/Instant'
        mimeType:
          type: [string, 'null']
        version:
          type: string
    AnswerRequest:
      type: object
      x-entity: pregunta
      required: [tiempoRespuestaMs, baseRevision]
      additionalProperties: false
      properties:
        opcionSeleccionadaId:
          type: [string, 'null']
          format: uuid
          description: 'null or absent means skip.'
        tiempoRespuestaMs:
          type: integer
          minimum: 0
          description: 'Client-measured, advisory; the server clamps it to the server-side gap.'
        nivelConfianza:
          type: integer
        baseRevision:
          type: integer
          minimum: 0
          description: '0 for the first answer.'
    AnswerResult:
      type: object
      required: [revision, estado, esPrimeraRespuesta, respondidas]
      properties:
        revision:
          type: integer
          minimum: 0
        estado:
          type: string
          enum: [ANSWERED, SKIPPED, ANNULLED]
        esCorrecta:
          type: [boolean, 'null']
          description: 'DEC-015 (decided 2026-10-13): revealed when the question is answered (estado ANSWERED), for the three exam types, also when the same option is sent again with a new key. null or absent for SKIPPED and ANNULLED.'
        opcionCorrectaId:
          type: [string, 'null']
          format: uuid
          description: 'DEC-015: the correct option, revealed together with esCorrecta. null or absent for SKIPPED and ANNULLED; may be null while esCorrecta is present.'
        esPrimeraRespuesta:
          type: boolean
        respondidas:
          type: integer
          minimum: 0
    AbandonRequest:
      type: object
      required: [posicionPregunta, motivo]
      additionalProperties: false
      properties:
        posicionPregunta:
          type: integer
          minimum: 1
        motivo:
          type: string
          enum: [salida_usuario, otro]
    AttemptResult:
      type: object
      description: 'Single result DTO shared by D2-10 and D2-12.'
      required: [resumen, preguntas, porEtiqueta]
      properties:
        resumen:
          type: object
          required: [modo, nota, calificacion, duracionSegundos, correctas, falladas, sinResponder]
          properties:
            examenId:
              type: [string, 'null']
              format: uuid
            especialidadId:
              type: [string, 'null']
              format: uuid
              description: 'Specialty of the exam the result belongs to (DEC-002); stays fixed when the user later changes specialty.'
            modo:
              type: string
              description: 'Value set pending DEC-018.'
            esDemo:
              type: boolean
              description: 'FA28: true when the result is of a DEMO attempt (only the demo-flagged questions). Absent = false. resumen.modo stays the exam type.'
            nota:
              type: [number, 'null']
              description: 'FA31: nota = max(0, correctas x den - num x falladas) x 10 / (den x evaluables), exact rational arithmetic, rounded HALF-UP to 2 decimals once, computed by the database (the only implementation). With penalizacion 0 it is the DEC-013 formula. null when evaluables = 0 (nothing was evaluable: no division by zero).'
            evaluables:
              type: integer
              minimum: 0
              description: 'FA31: questions counted in the grade (correctas + falladas + sinResponder).'
            anuladas:
              type: integer
              minimum: 0
              description: 'FA31: annulled main questions frozen at start.'
            reservasUsadas:
              type: integer
              minimum: 0
              description: 'FA31: reserves activated at start (REEMPLAZO_POR_RESERVA only).'
            anuladasSinReserva:
              type: integer
              minimum: 0
              description: 'FA31: annulled questions that had no reserve to replace them under REEMPLAZO_POR_RESERVA (they count as NO_PUNTUA).'
            reglaAnuladas:
              type: string
              enum: [REEMPLAZO_POR_RESERVA, NO_PUNTUA]
              description: 'FA31: the rule in force frozen when the attempt started (derived when the exam sets none: reserves -> REEMPLAZO_POR_RESERVA, no reserves -> NO_PUNTUA). Absent on attempts that predate FA31.'
            penalizacion:
              type: object
              required: [tipo]
              description: 'FA31/FA36: the penalty rule FROZEN when the attempt started (a later change of the exam never alters a grade already given). tipo FIJA = numerador/denominador per wrong answer (1/3 typical). tipo RACIONAL (FA36, owner 2026-10-17) = each wrong answer subtracts 1/(n-1) of a correct one, n = the number of options of THAT question (4 options: three wrong cancel one right; 3 options: two wrong cancel one right): PD = A - E/(n-1) over the evaluable questions (annulled excluded, activated reserves included), then the usual 0-10 scale, never below 0; unanswered and skipped are never penalised; a question with fewer than 2 options carries no penalty. descuento = what the wrong answers deduct, in units of CORRECT ANSWERS (0.67 = two thirds of one right answer), not points of the 0-10 scale (informative; show as "equivale a {descuento} aciertos"). Absent when the attempt predates FA31, is a demo, or does not penalise.'
              properties:
                tipo:
                  type: string
                  enum: [FIJA, RACIONAL]
                numerador:
                  type: integer
                  minimum: 1
                denominador:
                  type: integer
                  minimum: 1
                descuento:
                  type: number
                  minimum: 0
            calificacion:
              type: string
            duracionSegundos:
              type: integer
              minimum: 0
            correctas:
              type: integer
              minimum: 0
            falladas:
              type: integer
              minimum: 0
            sinResponder:
              type: integer
              minimum: 0
        preguntas:
          type: array
          maxItems: 200
          items:
            type: object
            required: [posicion, tiempoSeg]
            properties:
              posicion:
                type: integer
                minimum: 1
              estado:
                type: string
                enum: [CORRECT, WRONG, SKIPPED, UNANSWERED, ANNULLED, RESERVA_NO_UTILIZADA]
                description: 'FA31: optional. RESERVA_NO_UTILIZADA = a reserve that was not activated; its content is visible only here and in the review, after the attempt finished.'
              rol:
                type: string
                enum: [PRINCIPAL, RESERVA]
              sustituyeA:
                type: integer
                minimum: 1
              opcionElegida:
                type: [string, 'null']
                format: uuid
              opcionCorrecta:
                type: [string, 'null']
                format: uuid
              razonamiento:
                type: [string, 'null']
                description: 'Markdown.'
              razonamientoRico:
                description: 'FA38 (additive): the styled version of razonamiento; absent when the text has no style or explanations are not served (EXPLANATIONS_VISIBLE).'
                $ref: '#/components/schemas/RichText'
              tiempoSeg:
                type: integer
                minimum: 0
              pctAciertoGlobal:
                type: [number, 'null']
                description: 'null until DEC-019 and DEC-004.'
        porEtiqueta:
          type: array
          items:
            type: object
            required: [etiquetaId, nombre, correctas, falladas, sinResponder, tiempoTotalSeg]
            properties:
              etiquetaId:
                $ref: '../common/identifiers.yaml#/components/schemas/Uuid'
              nombre:
                type: string
              correctas:
                type: integer
                minimum: 0
              falladas:
                type: integer
                minimum: 0
              sinResponder:
                type: integer
                minimum: 0
              tiempoTotalSeg:
                type: integer
                minimum: 0
        comparativa:
          type: [object, 'null']
          description: 'null until DEC-019 and DEC-004.'
        probabilidadPlaza:
          type: [object, 'null']
          description: 'null until DEC-016.'
          required: [porcentaje, totalComparables]
          properties:
            porcentaje:
              type: number
              minimum: 0
              maximum: 100
            totalComparables:
              type: integer
              minimum: 0
    ReviewAttempt:
      type: object
      required: [id, origen, tipoExamen, estado, motivoFin, iniciadoEn, finalizadoEn, duracionSegundos]
      properties:
        id:
          $ref: '../common/identifiers.yaml#/components/schemas/Uuid'
        examenId:
          type: [string, 'null']
          format: uuid
        especialidadId:
          type: [string, 'null']
          format: uuid
          description: 'Specialty of the exam of this attempt at start (DEC-002), not the user current specialty.'
        origen:
          $ref: '../common/identifiers.yaml#/components/schemas/AttemptOrigin'
        tipoExamen:
          $ref: '../common/identifiers.yaml#/components/schemas/TipoExamen'
        estado:
          type: string
          const: finalizado
        motivoFin:
          $ref: '#/components/schemas/MotivoFin'
        iniciadoEn:
          $ref: '../common/identifiers.yaml#/components/schemas/Instant'
        finalizadoEn:
          $ref: '../common/identifiers.yaml#/components/schemas/Instant'
        duracionSegundos:
          type: integer
          minimum: 0
    ReviewItem:
      type: object
      x-entity: pregunta
      required: [posicion, preguntaId, codigoPregunta, tipoPregunta, enunciado, opciones, status, cambioRespuesta, esPrimeraRespuesta, resources, timings, etiquetas]
      properties:
        posicion:
          type: integer
          minimum: 1
        preguntaId:
          $ref: '../common/identifiers.yaml#/components/schemas/Uuid'
        codigoPregunta:
          type: string
        tipoPregunta:
          $ref: '../common/identifiers.yaml#/components/schemas/TipoPregunta'
        enunciado:
          type: string
        opciones:
          type: array
          items:
            $ref: '#/components/schemas/QuestionOption'
        status:
          type: string
          description: 'Frozen at finish. ANNULLED = annulled main question (FA31: annulment is frozen at START for attempts that carry reglaAnuladas; earlier attempts keep the live rule). RESERVA_NO_UTILIZADA (FA31) = a reserve that was not activated: shown last, labelled by the client as unused, with no answer and no solution.'
          enum: [CORRECT, WRONG, SKIPPED, UNANSWERED, ANNULLED, RESERVA_NO_UTILIZADA]
        rol:
          type: string
          enum: [PRINCIPAL, RESERVA]
          description: 'FA31: block of the question in an official exam. Absent = PRINCIPAL. A RESERVA appears in an open attempt only when it was ACTIVATED at start (REEMPLAZO_POR_RESERVA); unused reserves are never served while the attempt is open.'
        sustituyeA:
          type: integer
          minimum: 1
          description: 'FA31: only on an activated reserve: the posicion of the annulled main question it replaces.'
        firstAnswer:
          type: [object, 'null']
          description: 'primera_opcion_id / primera_es_correcta, immutable; null when never answered or ANNULLED.'
          required: [respondidaEn]
          properties:
            opcionId:
              type: [string, 'null']
              format: uuid
              description: 'null means skip.'
            esCorrecta:
              type: [boolean, 'null']
            respondidaEn:
              $ref: '../common/identifiers.yaml#/components/schemas/Instant'
        finalAnswer:
          type: [object, 'null']
          description: 'opcion_seleccionada_id / es_correcta; drives the grade; equals firstAnswer when there was no change.'
          required: [actualizadaEn, revision]
          properties:
            opcionId:
              type: [string, 'null']
              format: uuid
            esCorrecta:
              type: [boolean, 'null']
            actualizadaEn:
              $ref: '../common/identifiers.yaml#/components/schemas/Instant'
            revision:
              type: integer
              minimum: 0
        cambioRespuesta:
          type: boolean
        esPrimeraRespuesta:
          type: boolean
          description: 'The user first-ever response to the question (PDF 2.1-05).'
        correctAnswer:
          type: [object, 'null']
          description: 'Non-null for every non-ANNULLED item; null for ANNULLED.'
          required: [opcionId, letra]
          properties:
            opcionId:
              $ref: '../common/identifiers.yaml#/components/schemas/Uuid'
            letra:
              $ref: '../common/identifiers.yaml#/components/schemas/OptionLetter'
        explanation:
          type: [object, 'null']
          description: 'Visibility is product policy (DEC-025, DEC-040); technical default returns it to the owner.'
          required: [razonamiento]
          properties:
            razonamiento:
              $ref: '../common/identifiers.yaml#/components/schemas/Markdown'
            razonamientoRico:
              description: 'FA38 (additive): the styled version of razonamiento (the plain text is always in razonamiento); absent when the text has no style.'
              $ref: '#/components/schemas/RichText'
        resources:
          type: array
          description: 'V1 resources of the bound revision (amendment 2026-10-14); bytes via D2-66. Empty when none.'
          items:
            $ref: '#/components/schemas/AttemptResource'
        timings:
          type: object
          required: []
          properties:
            tiempoRespuestaMs:
              type: [integer, 'null']
              minimum: 0
              description: 'Client-measured, server-clamped.'
            respondidaEn:
              type: [string, 'null']
              format: date-time
            actualizadaEn:
              type: [string, 'null']
              format: date-time
        etiquetas:
          type: array
          items:
            type: object
            required: [id, nombre]
            properties:
              id:
                $ref: '../common/identifiers.yaml#/components/schemas/Uuid'
              nombre:
                type: string
