# FORO / RED (FA35, V1 wave 5b, text part). Contract: E1-V1-W5-FORO-CONTRACT.md; design E4-V1-FORO-DESIGN v3.1 + E1-V1-FORO-MIGRATION-NOTES (M-F1..M-F10).
# The user is always the JWT sub. THE GATE: a user reads and writes only channels whose especialidad_id is null or equal to the caller's specialty; a user with NO specialty has no forum. Every id-based call re-evaluates the gate and answers the
# SAME 404 for: another specialty, hidden / deleted content, a post still in pre-moderation that is not the caller's, comments / votes / reports / deletes on anything the caller cannot read.
# Author = {handle} only (the username chosen at onboarding; null = deleted account tombstone). Plain text only: links are refused (422 CONTENT_REJECTED), ZWJ sequences are refused, bidi / zero-width characters are stripped.
# New posts of an account (the first N approved by Control) and identical texts posted by another user within an hour are created in pre-moderation: returned only to their author with enRevision = true.
# Limits are database-authoritative and Control-configurable (posts 5/h 20/day, comments 30/h, reports 20/day, votes 60/min 500/day); 429 carries Retry-After. D5-01 (existing) lists only the channels open to every specialty; D5-02 is the gated list the app uses.
components:
  pathItems:
    ForoChannels:
      get:
        operationId: listForumChannels
        summary: 'Forum channels open to the caller (specialty gate)'
        tags: [community]
        x-contract-id: D5-02
        x-implementation: TARGET
        x-slice: 5
        x-roles: [USER]
        x-pagination: NONE
        x-idempotency: NONE
        x-error-codes: [UNAUTHENTICATED, ACCOUNT_BLOCKED, ACCOUNT_DELETION_PENDING, PROFILE_MISSING, RATE_LIMITED, UPSTREAM_UNAVAILABLE]
        description: 'Active channels whose especialidad_id is null or equal to the caller specialty, ordered by posicion then name. A user without specialty gets an empty list. soloLectura = no composer.'
        security:
          - bearerAuth: []
        responses:
          '200':
            description: 'Channels.'
            headers:
              Cache-Control:
                $ref: '#/components/headers/NoStore'
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/ForoCanalList'
          '401':
            $ref: '../common/errors.yaml#/components/responses/Unauthenticated'
          '403':
            $ref: '../common/errors.yaml#/components/responses/Forbidden'
          '429':
            $ref: '../common/errors.yaml#/components/responses/RateLimited'
          '503':
            $ref: '../common/errors.yaml#/components/responses/UpstreamUnavailable'
    ForoPosts:
      get:
        operationId: listForumPosts
        summary: 'Forum feed of a channel (or all the caller channels)'
        tags: [community]
        x-contract-id: D5-03
        x-implementation: TARGET
        x-slice: 5
        x-roles: [USER]
        x-pagination: CURSOR
        x-idempotency: NONE
        x-error-codes: [VALIDATION, INVALID_CURSOR, UNAUTHENTICATED, ACCOUNT_BLOCKED, ACCOUNT_DELETION_PENDING, PROFILE_MISSING, RATE_LIMITED, UPSTREAM_UNAVAILABLE]
        description: 'orden recientes (default) or votadas (valid votes first; votes of young accounts are ignored). Keyset cursor. The caller own posts in pre-moderation appear with enRevision = true; nobody else sees them. 404 FORO_NOT_FOUND for a channel outside the gate.'
        security:
          - bearerAuth: []
        parameters:
          - name: categoriaId
            in: query
            required: false
            schema:
              $ref: '../common/identifiers.yaml#/components/schemas/Uuid'
          - name: orden
            in: query
            required: false
            schema:
              type: string
              enum: [recientes, votadas]
              default: recientes
          - $ref: '../common/pagination.yaml#/components/parameters/Cursor'
          - $ref: '../common/pagination.yaml#/components/parameters/LimitApp'
        responses:
          '200':
            description: 'One page.'
            headers:
              Cache-Control:
                $ref: '#/components/headers/NoStore'
            content:
              application/json:
                schema:
                  allOf:
                    - $ref: '../common/pagination.yaml#/components/schemas/CursorPageEnvelope'
                    - type: object
                      required: [items]
                      properties:
                        items:
                          type: array
                          maxItems: 50
                          items:
                            $ref: '#/components/schemas/ForoPublicacionItem'
          '400':
            $ref: '../common/errors.yaml#/components/responses/BadRequest'
          '401':
            $ref: '../common/errors.yaml#/components/responses/Unauthenticated'
          '403':
            $ref: '../common/errors.yaml#/components/responses/Forbidden'
          '404':
            $ref: '../common/errors.yaml#/components/responses/NotFound'
          '429':
            $ref: '../common/errors.yaml#/components/responses/RateLimited'
          '503':
            $ref: '../common/errors.yaml#/components/responses/UpstreamUnavailable'
      post:
        operationId: createForumPost
        summary: 'Create a forum post'
        tags: [community]
        x-contract-id: D5-06
        x-implementation: TARGET
        x-slice: 5
        x-roles: [USER]
        x-pagination: NONE
        x-idempotency: OPTIONAL
