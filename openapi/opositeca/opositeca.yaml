# OPOSITECA / GUARDAR (FA26, V1): the user's saved questions. Design: E1-V1-SAVED-CONTRACT.md.
# V1 scope: tipo = pregunta ONLY. Saving resources or whole exams, other sort and filter fields and community grouping are
# NEEDS_OWNER_DECISION and are NOT in this contract (adding a tipo value later is additive).
# Everything is owner-scoped by the JWT sub (never a user id in the path or body). The access check (specialty gate first, then the single access
# verdict) and the cap are decided by the database inside ONE function per command under a per-user lock.
components:
  pathItems:
    SavedItem:
      put:
        operationId: saveItem
        summary: 'Save a question in the OposiTeca'
        tags: [opositeca]
        x-contract-id: D4-20
        x-implementation: TARGET
        x-slice: 5
        x-roles: [USER]
        x-pagination: NONE
        x-idempotency: NATURAL
        x-error-codes: [VALIDATION, UNAUTHENTICATED, ACCOUNT_BLOCKED, ACCOUNT_DELETION_PENDING, PROFILE_MISSING, NOT_FOUND, SAVED_LIMIT_REACHED, RATE_LIMITED, UPSTREAM_UNAVAILABLE]
        description: 'Naturally idempotent (no Idempotency-Key): saving an already saved question answers 200 with the ORIGINAL guardadoEn and writes nothing, even if the access was lost since. A NEW save needs the question to have been REVEALED to the caller (FA50b, review 2026-11-14: answered by them, in a finished attempt of theirs, served to them in a page counted by the daily limit, or in an attempt of theirs the daily limit does not count) and to be active and to belong (not as an unused reserve) to at least one exam that is active, published and not LOCKED for the caller (the specialty gate is rule 0 of that verdict): a missing question and a question the user cannot open are the SAME 404 NOT_FOUND (no probing of other specialties). Cap: 500 saved questions per user (technical default, NEEDS_OWNER_DECISION) = 422 SAVED_LIMIT_REACHED. Limit: 60 per minute per user (429 RATE_LIMITED).'
        security:
          - bearerAuth: []
        parameters:
          - $ref: '#/components/parameters/SavedTipo'
          - $ref: '#/components/parameters/SavedTargetId'
        responses:
          '200':
            description: 'Saved (or already saved).'
            headers:
              Cache-Control:
                $ref: '#/components/headers/NoStore'
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/SavedItem'
          '400':
            $ref: '../common/errors.yaml#/components/responses/BadRequest'
          '401':
            $ref: '../common/errors.yaml#/components/responses/Unauthenticated'
          '403':
            $ref: '../common/errors.yaml#/components/responses/Forbidden'
          '404':
            $ref: '../common/errors.yaml#/components/responses/NotFound'
            description: 'NOT_FOUND: the question does not exist, is inactive, was never revealed to the caller, or the caller can open none of its exams.'
          '422':
            $ref: '../common/errors.yaml#/components/responses/UnprocessableEntity'
            description: 'SAVED_LIMIT_REACHED.'
          '429':
            $ref: '../common/errors.yaml#/components/responses/RateLimited'
          '503':
            $ref: '../common/errors.yaml#/components/responses/UpstreamUnavailable'
      delete:
        operationId: unsaveItem
        summary: 'Remove a question from the OposiTeca'
        tags: [opositeca]
        x-contract-id: D4-21
        x-implementation: TARGET
        x-slice: 5
        x-roles: [USER]
        x-pagination: NONE
        x-idempotency: NATURAL
        x-error-codes: [VALIDATION, UNAUTHENTICATED, ACCOUNT_BLOCKED, ACCOUNT_DELETION_PENDING, PROFILE_MISSING, RATE_LIMITED, UPSTREAM_UNAVAILABLE]
        description: 'Idempotent: 204 whether the question was saved or not. Scoped to the caller: it can never touch another user row.'
        security:
          - bearerAuth: []
        parameters:
          - $ref: '#/components/parameters/SavedTipo'
          - $ref: '#/components/parameters/SavedTargetId'
        responses:
          '204':
            description: 'Not saved any more (it may never have been).'
            headers:
              Cache-Control:
                $ref: '#/components/headers/NoStore'
          '400':
            $ref: '../common/errors.yaml#/components/responses/BadRequest'
          '401':
            $ref: '../common/errors.yaml#/components/responses/Unauthenticated'
          '403':
            $ref: '../common/errors.yaml#/components/responses/Forbidden'
          '429':
            $ref: '../common/errors.yaml#/components/responses/RateLimited'
          '503':
            $ref: '../common/errors.yaml#/components/responses/UpstreamUnavailable'
      get:
        operationId: getSavedQuestionDetail
        summary: 'One saved question with its options, correct answer, explanation and resources (Library sheet)'
        tags: [opositeca]
        x-contract-id: D4-29
        x-implementation: TARGET
        x-slice: 5
        x-roles: [USER]
        x-pagination: NONE
        x-idempotency: NONE
        x-error-codes: [VALIDATION, UNAUTHENTICATED, ACCOUNT_BLOCKED, ACCOUNT_DELETION_PENDING, PROFILE_MISSING, NOT_FOUND, RATE_LIMITED, UPSTREAM_UNAVAILABLE]
        description: 'FA50 (owner plan 2026-11-14, additive): the Library opens a saved question in place. Served ONLY when the caller saved it AND can open one of its exams (the D4-24 rule: an active, published exam whose access verdict is FREE, GRANTED or SUBSCRIPTION; the specialty gate first); otherwise 404 NOT_FOUND (not saved, no access and missing are the same). The item has the SAME schema as a D2-65 review item (ReviewItem) for a question outside any attempt: content and solution are the LIVE ones (built by the functions that freeze attempt revisions), but the solution ONLY once the caller resolved the question (FA50b, review 2026-11-14): an answer of theirs with a chosen option, or a finished attempt of theirs that contains it; until then correctAnswer and explanation are null and the response is still 200 (saving a question of an open attempt never reveals its answer), posicion = the position in the chosen exam, status = ANNULLED when the question is annulled in that exam (then correctAnswer and explanation are null, as in the review) or UNANSWERED, and firstAnswer, finalAnswer, timings are empty. Plus examenId, examenTitulo, tipoExamen of the chosen exam (a non-annulled link first, then the latest publication; an unused reserve link is never chosen) and anulada. explanation follows the same product policy as D2-65 (EXPLANATIONS_VISIBLE). Resource bytes via D4-28. It never touches the daily question limit (the question was already revealed when it was saved).'
        security:
          - bearerAuth: []
        parameters:
          - $ref: '#/components/parameters/SavedTipo'
          - $ref: '#/components/parameters/SavedTargetId'
        responses:
          '200':
            description: 'The saved question.'
            headers:
              Cache-Control:
                $ref: '#/components/headers/NoStore'
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/SavedQuestionDetail'
          '400':
            $ref: '../common/errors.yaml#/components/responses/BadRequest'
          '401':
            $ref: '../common/errors.yaml#/components/responses/Unauthenticated'
          '403':
            $ref: '../common/errors.yaml#/components/responses/Forbidden'
          '404':
            $ref: '../common/errors.yaml#/components/responses/NotFound'
            description: 'NOT_FOUND: not saved by the caller, no accessible exam, or the question is inactive or missing.'
          '429':
            $ref: '../common/errors.yaml#/components/responses/RateLimited'
          '503':
            $ref: '../common/errors.yaml#/components/responses/UpstreamUnavailable'
    SavedState:
      get:
        operationId: savedItemsState
        summary: 'Which of these questions are saved (toggle state)'
        tags: [opositeca]
        x-contract-id: D4-26
        x-implementation: TARGET
        x-slice: 5
        x-roles: [USER]
        x-pagination: NONE
        x-idempotency: NONE
        x-error-codes: [VALIDATION, UNAUTHENTICATED, ACCOUNT_BLOCKED, ACCOUNT_DELETION_PENDING, PROFILE_MISSING, RATE_LIMITED, UPSTREAM_UNAVAILABLE]
        description: 'Initial state of the Guardar toggle: pass the visible question ids (1 to 50, comma separated) and get back ONLY the ones the caller has saved. Unknown ids and ids saved by other users are simply absent. One call per screen; the client does not list the whole OposiTeca to render a heart.'
        security:
          - bearerAuth: []
        parameters:
          - $ref: '#/components/parameters/SavedTipo'
          - name: ids
            in: query
            required: true
            description: 'Comma separated question uuids, 1 to 50.'
            schema:
              type: string
              minLength: 36
        responses:
          '200':
            description: 'The saved subset.'
            headers:
              Cache-Control:
                $ref: '#/components/headers/NoStore'
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/SavedState'
          '400':
            $ref: '../common/errors.yaml#/components/responses/BadRequest'
          '401':
            $ref: '../common/errors.yaml#/components/responses/Unauthenticated'
          '403':
            $ref: '../common/errors.yaml#/components/responses/Forbidden'
          '429':
            $ref: '../common/errors.yaml#/components/responses/RateLimited'
          '503':
            $ref: '../common/errors.yaml#/components/responses/UpstreamUnavailable'
    Opositeca:
      get:
        operationId: listOpositeca
        summary: 'The user OposiTeca (saved questions)'
        tags: [opositeca]
        x-contract-id: D4-24
        x-implementation: TARGET
        x-slice: 5
        x-roles: [USER]
        x-pagination: CURSOR
        x-idempotency: NONE
        x-error-codes: [VALIDATION, INVALID_CURSOR, UNAUTHENTICATED, ACCOUNT_BLOCKED, ACCOUNT_DELETION_PENDING, PROFILE_MISSING, RATE_LIMITED, UPSTREAM_UNAVAILABLE]
        description: 'Keyset page ordered by guardadoEn descending then id descending (the only order in V1). Filter: tipo (only pregunta exists). The access is recomputed at read time: while the caller can open an exam of the question, accesible is true and pregunta carries the title and the exam (the accessible exam with the latest publication); when it cannot, the item STAYS (so it can be removed) with accesible false and pregunta null: the content of an exam the user can no longer open is not served. No explanation and no resources are returned (DEC-025 is open). FA50 (2026-11-14): pregunta also carries tipoExamen; the exam is chosen like D4-29 (a link where the question is not annulled first, then the latest publication), so a question annulled in every accessible exam is now accesible (its D4-29 detail says anulada) and an item is accesible exactly when its detail opens.'
        security:
          - bearerAuth: []
        parameters:
          - name: tipo
            in: query
            required: false
            schema:
              type: string
              enum: [pregunta]
          - $ref: '../common/pagination.yaml#/components/parameters/Cursor'
          - $ref: '../common/pagination.yaml#/components/parameters/LimitApp'
        responses:
          '200':
            description: 'A page of saved items.'
            headers:
              Cache-Control:
                $ref: '#/components/headers/NoStore'
            content:
              application/json:
                schema:
                  allOf:
                    - $ref: '../common/pagination.yaml#/components/schemas/CursorPageEnvelope'
                    - type: object
                      required: [items]
                      properties:
                        items:
                          type: array
                          items:
                            $ref: '#/components/schemas/SavedEntry'
          '400':
            $ref: '../common/errors.yaml#/components/responses/BadRequest'
          '401':
            $ref: '../common/errors.yaml#/components/responses/Unauthenticated'
          '403':
            $ref: '../common/errors.yaml#/components/responses/Forbidden'
          '429':
            $ref: '../common/errors.yaml#/components/responses/RateLimited'
          '503':
            $ref: '../common/errors.yaml#/components/responses/UpstreamUnavailable'
    SavedQuestionResource:
      get:
        operationId: getSavedQuestionResourceAccess
        summary: 'Temporary access to the bytes of a resource of a saved question'
        tags: [opositeca]
        x-contract-id: D4-28
        x-implementation: TARGET
        x-slice: 5
        x-roles: [USER]
        x-pagination: NONE
        x-idempotency: NONE
        x-error-codes: [VALIDATION, UNAUTHENTICATED, ACCOUNT_BLOCKED, ACCOUNT_DELETION_PENDING, PROFILE_MISSING, NOT_FOUND, RESOURCE_NOT_FOUND, RATE_LIMITED, UPSTREAM_UNAVAILABLE]
        description: 'FA50 (additive): same authorization as D4-29 (saved by the caller and an accessible exam), then the resource must be one of the LIVE V1 resources of that question (image, audio, video); Ktor signs a short-lived Storage URL exactly like D2-66 (same bucket and path rules, never the internal path).'
        security:
          - bearerAuth: []
        parameters:
          - $ref: '#/components/parameters/SavedTipo'
          - $ref: '#/components/parameters/SavedTargetId'
          - name: recursoId
            in: path
            required: true
            schema:
              $ref: '../common/identifiers.yaml#/components/schemas/Uuid'
        responses:
          '200':
            description: 'Signed URL and its expiry.'
            headers:
              Cache-Control:
                $ref: '#/components/headers/NoStore'
            content:
              application/json:
                schema:
                  $ref: '../attempts/attempts.yaml#/components/schemas/AttemptResourceAccess'
          '400':
            $ref: '../common/errors.yaml#/components/responses/BadRequest'
          '401':
            $ref: '../common/errors.yaml#/components/responses/Unauthenticated'
          '403':
            $ref: '../common/errors.yaml#/components/responses/Forbidden'
          '404':
            $ref: '../common/errors.yaml#/components/responses/NotFound'
            description: 'NOT_FOUND (as D4-29) or RESOURCE_NOT_FOUND (not a current V1 resource of the question).'
          '429':
            $ref: '../common/errors.yaml#/components/responses/RateLimited'
          '503':
            $ref: '../common/errors.yaml#/components/responses/UpstreamUnavailable'
            description: 'UPSTREAM_UNAVAILABLE: Storage could not sign. Retryable.'
  parameters:
    SavedTipo:
      name: tipo
      in: path
      required: true
      description: 'Kind of saved thing. V1: pregunta only (closed enum).'
      schema:
        type: string
        enum: [pregunta]
    SavedTargetId:
      name: targetId
      in: path
      required: true
      description: 'Question id.'
      schema:
        type: string
        format: uuid
  headers:
    NoStore:
      description: 'no-store'
      required: true
      schema:
        type: string
        enum: ['no-store']
  schemas:
    SavedItem:
      type: object
      required: [tipo, targetId, guardadoEn]
      properties:
        tipo:
          type: string
          enum: [pregunta]
        targetId:
          $ref: '../common/identifiers.yaml#/components/schemas/Uuid'
        guardadoEn:
          $ref: '../common/identifiers.yaml#/components/schemas/Instant'
    SavedQuestion:
      type: object
      required: [titulo, examenId, examenTitulo]
      properties:
        titulo:
          type: string
        examenId:
          $ref: '../common/identifiers.yaml#/components/schemas/Uuid'
        examenTitulo:
          type: string
        tipoExamen:
          $ref: '../common/identifiers.yaml#/components/schemas/TipoExamen'
          description: 'FA50 (additive): the type of the exam in examenId.'
    SavedQuestionDetail:
      description: 'FA50: a D2-65 ReviewItem for a question outside any attempt, plus the exam it is shown from.'
      allOf:
        - $ref: '../attempts/attempts.yaml#/components/schemas/ReviewItem'
        - type: object
          required: [examenId, examenTitulo, tipoExamen, anulada]
          properties:
            examenId:
              $ref: '../common/identifiers.yaml#/components/schemas/Uuid'
            examenTitulo:
              type: string
            tipoExamen:
              $ref: '../common/identifiers.yaml#/components/schemas/TipoExamen'
            anulada:
              type: boolean
              description: 'True when the question is annulled in examenId (status ANNULLED, no correctAnswer, no explanation). Not annulled but not yet resolved by the caller (FA50b): status UNANSWERED and no correctAnswer or explanation either.'
    SavedEntry:
      type: object
      required: [tipo, targetId, guardadoEn, accesible]
      properties:
        tipo:
          type: string
          enum: [pregunta]
        targetId:
          $ref: '../common/identifiers.yaml#/components/schemas/Uuid'
        guardadoEn:
          $ref: '../common/identifiers.yaml#/components/schemas/Instant'
        accesible:
          type: boolean
        pregunta:
          description: 'Present only when accesible is true.'
          oneOf:
            - $ref: '#/components/schemas/SavedQuestion'
            - type: 'null'
    SavedState:
      type: object
      required: [tipo, guardados]
      properties:
        tipo:
          type: string
          enum: [pregunta]
        guardados:
          type: array
          items:
            $ref: '../common/identifiers.yaml#/components/schemas/Uuid'
