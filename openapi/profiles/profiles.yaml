        x-pagination: NONE
        x-idempotency: NONE
        x-error-codes: [VALIDATION, UNAUTHENTICATED, FORBIDDEN, NOT_FOUND, INTERNAL]
        description: 'Composite admin-only read; sections are individually capped. economia is derived on read from transacciones_cartera, compras_usuario and atribucion_usuario (no summary cache).'
        security:
          - bearerAuth: []
        parameters:
          - $ref: '../common/identifiers.yaml#/components/parameters/UserIdPath'
          - name: sections
            in: query
            required: false
            description: 'Comma-separated sections; default all.'
            style: form
            explode: false
            schema:
              type: array
              items:
                $ref: '#/components/schemas/AdminUserDetailSection'
        responses:
          '200':
            description: 'User detail.'
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/AdminUserDetail'
          '400':
            $ref: '../common/errors.yaml#/components/responses/BadRequest'
          '401':
            $ref: '../common/errors.yaml#/components/responses/Unauthenticated'
          '403':
            $ref: '../common/errors.yaml#/components/responses/Forbidden'
          '404':
            $ref: '../common/errors.yaml#/components/responses/NotFound'
          '500':
            $ref: '../common/errors.yaml#/components/responses/Internal'
    AdminUserRoles:
      post:
        operationId: replaceAdminUserRoles
        summary: 'Replace the roles of a user'
        tags: [profiles-admin]
        x-contract-id: D1-26
        x-implementation: TARGET
        x-slice: 1
        x-roles: [ADMIN, SUPERADMIN]
        x-pagination: NONE
        x-idempotency: NATURAL
        x-error-codes: [VALIDATION, UNAUTHENTICATED, FORBIDDEN, SUPERADMIN_REQUIRED, ROLE_SYNC_LAST_SUPERADMIN, VERSION_CONFLICT, ROLE_SYNC_EMPTY_ROLES, ROLE_SYNC_UNKNOWN_ROLE, ROLE_SYNC_INVALID_USER, INTERNAL]
        description: 'Idempotent full replace via rpc admin_sync_roles; granting or removing admin or superadmin requires SUPERADMIN. Optional precondition (FA8): when expectedRoleIds is sent and, as a set, differs from the current roles of the user, nothing is written and the answer is 409 VERSION_CONFLICT.'
        security:
          - bearerAuth: []
        parameters:
          - $ref: '../common/identifiers.yaml#/components/parameters/UserIdPath'
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminRoleSyncRequest'
        responses:
          '200':
            description: 'Resulting roles.'
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/RoleIdsBody'
          '400':
            $ref: '../common/errors.yaml#/components/responses/BadRequest'
          '401':
            $ref: '../common/errors.yaml#/components/responses/Unauthenticated'
          '403':
            $ref: '../common/errors.yaml#/components/responses/Forbidden'
            description: 'FORBIDDEN or SUPERADMIN_REQUIRED.'
          '409':
            $ref: '../common/errors.yaml#/components/responses/Conflict'
            description: 'ROLE_SYNC_LAST_SUPERADMIN or VERSION_CONFLICT (expectedRoleIds no longer matches the current roles).'
          '422':
            $ref: '../common/errors.yaml#/components/responses/UnprocessableEntity'
            description: 'ROLE_SYNC_EMPTY_ROLES, ROLE_SYNC_UNKNOWN_ROLE or ROLE_SYNC_INVALID_USER.'
          '500':
            $ref: '../common/errors.yaml#/components/responses/Internal'
    AdminUserBlock:
      parameters:
        - $ref: '../common/identifiers.yaml#/components/parameters/UserIdPath'
      post:
        operationId: blockAdminUser
        summary: 'Block a user'
        tags: [profiles-admin]
        x-contract-id: D1-27
        x-implementation: TARGET
        x-slice: null
        x-roles: [ADMIN, SUPERADMIN]
        x-pagination: NONE
        x-idempotency: NATURAL
        x-error-codes: [VALIDATION, UNAUTHENTICATED, FORBIDDEN, CANNOT_BLOCK_SELF, SUPERADMIN_REQUIRED, NOT_FOUND, DELETION_PENDING, INTERNAL, UPSTREAM_ERROR]
        description: 'State-idempotent: an already blocked user returns 200 with no new audit row. Blocking staff requires SUPERADMIN. Applies the GoTrue ban.'
        security:
          - bearerAuth: []
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminBlockRequest'
        responses:
          '200':
            description: 'User blocked.'
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/AdminBlockResponse'
          '400':
            $ref: '../common/errors.yaml#/components/responses/BadRequest'
          '401':
            $ref: '../common/errors.yaml#/components/responses/Unauthenticated'
          '403':
            $ref: '../common/errors.yaml#/components/responses/Forbidden'
            description: 'FORBIDDEN, CANNOT_BLOCK_SELF or SUPERADMIN_REQUIRED.'
          '404':
            $ref: '../common/errors.yaml#/components/responses/NotFound'
          '409':
            $ref: '../common/errors.yaml#/components/responses/Conflict'
            description: 'DELETION_PENDING.'
          '500':
            $ref: '../common/errors.yaml#/components/responses/Internal'
          '502':
            $ref: '../common/errors.yaml#/components/responses/UpstreamError'
            description: 'UPSTREAM_ERROR (GoTrue).'
      delete:
        operationId: unblockAdminUser
        summary: 'Unblock a user'
        tags: [profiles-admin]
        x-contract-id: D1-28
        x-implementation: TARGET
        x-slice: null
        x-roles: [ADMIN, SUPERADMIN]
        x-pagination: NONE
        x-idempotency: NATURAL
        x-error-codes: [VALIDATION, UNAUTHENTICATED, FORBIDDEN, NOT_FOUND, DELETION_PENDING, UPSTREAM_ERROR]
        description: 'State-idempotent: an already active user returns 200. Lifts the GoTrue ban.'
        security:
          - bearerAuth: []
        responses:
          '200':
            description: 'User active.'
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/AdminUnblockResponse'
          '400':
            $ref: '../common/errors.yaml#/components/responses/BadRequest'
          '401':
            $ref: '../common/errors.yaml#/components/responses/Unauthenticated'
          '403':
            $ref: '../common/errors.yaml#/components/responses/Forbidden'
          '404':
            $ref: '../common/errors.yaml#/components/responses/NotFound'
          '409':
            $ref: '../common/errors.yaml#/components/responses/Conflict'
            description: 'DELETION_PENDING.'
          '502':
            $ref: '../common/errors.yaml#/components/responses/UpstreamError'
    AdminRoles:
      get:
        operationId: listAdminRoles
        summary: 'List roles'
        tags: [profiles-admin]
        x-contract-id: D1-29
        x-implementation: TARGET
        x-slice: null
        x-roles: [ADMIN, SUPERADMIN]
        x-pagination: NONE
        x-idempotency: NONE
        x-error-codes: [UNAUTHENTICATED, FORBIDDEN, INTERNAL]
        description: 'Fixed 4-code catalog (bounded by CHECK).'
        security:
          - bearerAuth: []
        responses:
          '200':
            description: 'Roles.'
            content:
              application/json:
                schema:
                  type: object
                  required: [items]
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/Role'
          '401':
            $ref: '../common/errors.yaml#/components/responses/Unauthenticated'
          '403':
            $ref: '../common/errors.yaml#/components/responses/Forbidden'
          '500':
            $ref: '../common/errors.yaml#/components/responses/Internal'
    AdminLegalDocuments:
      post:
        operationId: createAdminLegalDocument
        summary: 'Create a legal document version'
        tags: [profiles-admin]
        x-contract-id: D1-30
        x-implementation: TARGET
        x-slice: null
        x-roles: [SUPERADMIN]
        x-pagination: NONE
        x-idempotency: NATURAL
        x-error-codes: [VALIDATION, UNAUTHENTICATED, FORBIDDEN, VERSION_EXISTS, INTERNAL]
        description: 'Natural key (tipo, version) is unique; a repeat returns 409.'
        security:
          - bearerAuth: []
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminLegalDocumentCreateRequest'
        responses:
          '201':
            description: 'Created.'
            headers:
              Location:
                description: 'URI of the created resource.'
                required: false
                schema:
                  type: string
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/AdminLegalDocumentCreated'
          '400':
            $ref: '../common/errors.yaml#/components/responses/BadRequest'
          '401':
            $ref: '../common/errors.yaml#/components/responses/Unauthenticated'
          '403':
            $ref: '../common/errors.yaml#/components/responses/Forbidden'
          '409':
            $ref: '../common/errors.yaml#/components/responses/Conflict'
            description: 'VERSION_EXISTS.'
          '500':
            $ref: '../common/errors.yaml#/components/responses/Internal'
  headers:
    ProfileETag:
      description: 'Current profile version (opaque strong validator). The client sends it back as If-Match on PATCH /api/v1/app/me/profile for optimistic concurrency; it is omitted only if the server has no version for the profile; in that case a client must not save blindly (re-read first).'
      required: false
      schema:
        type: string
  schemas:
    AuthProvider:
      type: string
      enum: [email, apple, google]
    Me:
      type: object
      description: 'Current user. Additional sections may be added (DEC-002 may only ADD fields); clients ignore unknown properties.'
      required: [id, authProviders, registeredAt, profile]
      properties:
        id:
          $ref: '../common/identifiers.yaml#/components/schemas/Uuid'
        email:
          type: [string, 'null']
          format: email
        authProviders:
          type: array
          items:
            $ref: '#/components/schemas/AuthProvider'
        registeredAt:
          $ref: '../common/identifiers.yaml#/components/schemas/Instant'
        profile:
          $ref: '#/components/schemas/MeProfile'
    MeProfile:
      type: object
      required: [onboardingCompleted, accountStatus]
      properties:
        username:
          type: [string, 'null']
        nombreMostrar:
          type: [string, 'null']
        nombre:
          type: [string, 'null']
        apellidos:
          type: [string, 'null']
        especialidadPrincipalId:
          type: [string, 'null']
          format: uuid
          description: 'The ONE active specialty of the user (DEC-002, DEC-001 adopted): a single FK, changeable through PATCH /api/v1/app/me/profile, never an array. History is not reinterpreted when it changes; attempts and results keep the specialty of their exam. A future secondary-interests extension would be a separate additive field and is not part of V1.'
        comunidadPrincipalId:
          type: [string, 'null']
          format: uuid
        avatarUrl:
          type: [string, 'null']
          format: uri
          description: 'Signed URL.'
        onboardingCompleted:
          type: boolean
        accountStatus:
          $ref: '../common/identifiers.yaml#/components/schemas/AccountStatus'
        introSeenAt:
          type: [string, 'null']
          format: date-time
    Username:
      type: string
      pattern: '^[A-Za-z0-9._-]{3,30}$'
    OnboardingRequest:
      type: object
      required: [username, nombre, apellidos, acceptedLegalDocumentIds]
      additionalProperties: false
      properties:
        username:
          $ref: '#/components/schemas/Username'
        nombre:
          type: string
          minLength: 1
          maxLength: 100
        apellidos:
          type: string
          minLength: 1
          maxLength: 100
        especialidadId:
          $ref: '../common/identifiers.yaml#/components/schemas/Uuid'
          description: 'Optional single active specialty (DEC-002); stored as perfiles_usuario.especialidad_principal_id.'
        acceptedLegalDocumentIds:
          type: array
          items:
            $ref: '../common/identifiers.yaml#/components/schemas/Uuid'
        attribution:
          $ref: '#/components/schemas/AttributionHints'
        referralCode:
          type: string
    AttributionHints:
      type: object
      description: 'Write-once, server-validated hints.'
      required: []
      additionalProperties: false
      properties:
        fuente:
          type: string
        canal:
          type: string
        campania:
          type: string
        plataforma:
          type: string
          enum: [android, ios, web]
        installReferrer:
          type: string
    ProfilePatchRequest:
      type: object
      required: []
      additionalProperties: false
      properties:
        username:
          $ref: '#/components/schemas/Username'
        nombre:
          type: string
          maxLength: 100
        apellidos:
          type: string
          maxLength: 100
        especialidadId:
          $ref: '../common/identifiers.yaml#/components/schemas/Uuid'
          description: 'New single active specialty (DEC-002); replaces the previous one and leaves attempt history untouched.'
        comunidadPrincipalId:
          $ref: '../common/identifiers.yaml#/components/schemas/Uuid'
        detail:
          $ref: '#/components/schemas/ProfileDetailPatch'
        targetCommunityIds:
          type: array
          items:
            $ref: '../common/identifiers.yaml#/components/schemas/Uuid'
        introSeen:
          type: boolean
    ProfileDetailPatch:
      type: object
      required: []
      additionalProperties: false
      properties:
        edad:
          type: integer
          minimum: 0
        ciudad:
          type: string
        estadoLaboral:
          type: string
        centroTrabajo:
          type: string
        tiempoEstudioMin:
          type: integer
          minimum: 0
        franja:
          type: string
        fechaExamenObjetivo:
          $ref: '../common/identifiers.yaml#/components/schemas/LocalDate'
    AvatarUpload:
      type: object
      required: [file]
      properties:
        file:
          type: string
          contentMediaType: application/octet-stream
          description: 'image/jpeg, image/png or image/webp; technical default limit 2 MiB.'
    AvatarResponse:
      type: object
      required: [avatarUrl, expiresAt]
      properties:
        avatarUrl:
          $ref: '../common/identifiers.yaml#/components/schemas/SignedUrl'
        expiresAt:
          $ref: '../common/identifiers.yaml#/components/schemas/Instant'
    LegalDocument:
      type: object
      required: [id, tipo, version, titulo, contenido, publicadoEn]
      properties:
        id:
          $ref: '../common/identifiers.yaml#/components/schemas/Uuid'
        tipo:
          $ref: '../common/identifiers.yaml#/components/schemas/LegalDocumentType'
        version:
          type: string
        titulo:
          type: string
        contenido:
          $ref: '../common/identifiers.yaml#/components/schemas/Markdown'
        publicadoEn:
          $ref: '../common/identifiers.yaml#/components/schemas/Instant'
    LegalAcceptanceRequest:
      type: object
      required: [documentIds, plataforma]
      additionalProperties: false
      properties:
        documentIds:
          type: array
          minItems: 1
          maxItems: 5
          items:
            $ref: '../common/identifiers.yaml#/components/schemas/Uuid'
        plataforma:
          type: string
          enum: [android, ios]
    LegalAcceptanceResponse:
      type: object
      required: [pendingLegalDocuments]
      properties:
        pendingLegalDocuments:
          type: array
          items:
            type: object
            required: [id, tipo, version]
            properties:
              id:
                $ref: '../common/identifiers.yaml#/components/schemas/Uuid'
              tipo:
                $ref: '../common/identifiers.yaml#/components/schemas/LegalDocumentType'
              version:
                type: string
    CredentialsChangeRequest:
      type: object
      required: [currentPassword]
      additionalProperties: false
      properties:
        currentPassword:
          type: string
          minLength: 1
        newPassword:
          type: string
          minLength: 12
          maxLength: 72
          pattern: '^[\x20-\x7E]{12,72}$'
          format: password
          description: 'Same rule as auth Password (FA17): 12 to 72 characters, printable ASCII only (U+0020 space to U+007E tilde, both included).'
        newEmail:
          type: string
          format: email
      oneOf:
        - required: [newPassword]
        - required: [newEmail]
    CredentialsChangeResponse:
      type: object
      required: [emailChangePending]
      properties:
        emailChangePending:
          type: boolean
    AccountDeletionRequest:
      type: object
      required: [confirmation]
      additionalProperties: false
      properties:
        confirmation:
          type: string
          const: ELIMINAR
        currentPassword:
          type: string
          description: 'Required for password accounts (re-authentication); ignored for OAuth accounts, which need a session authenticated within the last 5 minutes.'
    AccountDeletionAccepted:
      type: object
      required: [accountStatus, requestedAt]
      properties:
        accountStatus:
          type: string
          const: eliminacion_pendiente
        requestedAt:
          $ref: '../common/identifiers.yaml#/components/schemas/Instant'
    AdminMe:
      type: object
      required: [id, email, roles, permissions]
      properties:
        id:
          $ref: '../common/identifiers.yaml#/components/schemas/Uuid'
        email:
          type: string
          format: email
        nombreMostrar:
          type: [string, 'null']
        roles:
          type: array
          items:
            $ref: '../common/identifiers.yaml#/components/schemas/StaffRoleCode'
        permissions:
          type: array
          items:
            type: string
    AdminUserSummary:
      type: object
      required: [id, roleIds, accountStatus, createdAt]
      properties:
        id:
          $ref: '../common/identifiers.yaml#/components/schemas/Uuid'
        username:
          type: [string, 'null']
        fullName:
          type: [string, 'null']
        email:
          type: [string, 'null']
          format: email
        roleIds:
          type: array
          items:
            $ref: '../common/identifiers.yaml#/components/schemas/Uuid'
        accountStatus:
          $ref: '../common/identifiers.yaml#/components/schemas/AccountStatus'
        createdAt:
          $ref: '../common/identifiers.yaml#/components/schemas/Instant'
        ticketsBalance:
          type: [integer, 'null']
    AdminUser:
      type: object
      required: [id, roleIds, accountStatus, onboardingCompleted, createdAt, authProviders]
      properties:
        id:
          $ref: '../common/identifiers.yaml#/components/schemas/Uuid'
        username:
          type: [string, 'null']
        fullName:
          type: [string, 'null']
        email:
          type: [string, 'null']
          format: email
        roleIds:
          type: array
          items:
            $ref: '../common/identifiers.yaml#/components/schemas/Uuid'
        accountStatus:
          $ref: '../common/identifiers.yaml#/components/schemas/AccountStatus'
        bloqueo:
          type: [object, 'null']
          required: []
          properties:
            motivo:
              type: [string, 'null']
            en:
              type: [string, 'null']
              format: date-time
            por:
              type: [string, 'null']
              format: uuid
        onboardingCompleted:
          type: boolean
        createdAt:
          $ref: '../common/identifiers.yaml#/components/schemas/Instant'
        authProviders:
          type: array
          items:
            $ref: '#/components/schemas/AuthProvider'
    AdminUserResponse:
      description: 'D1-23 shape. The legacy data wrapper duplicates the same object until OC migrates.'
      allOf:
        - $ref: '#/components/schemas/AdminUser'
        - type: object
          required: []
          properties:
            data:
              deprecated: true
              allOf:
                - $ref: '#/components/schemas/AdminUser'
    AdminUserDetailSection:
      type: string
      enum: [perfil, rendimiento, competitivo, racha, economia, suscripciones, opositester, debilidades]
    AdminUserDetail:
      type: object
      description: 'Sections not requested or not available are null (or empty) and listed in seccionesNoDisponibles. Section internals other than economia are read models not frozen field by field.'
      required: [perfil, suscripciones, debilidades, seccionesNoDisponibles]
      properties:
        perfil:
          $ref: '#/components/schemas/AdminUser'
        detalle:
          type: [object, 'null']
        rendimiento:
          type: [object, 'null']
        competitivo:
          type: [object, 'null']
        racha:
          type: [object, 'null']
        economia:
          $ref: '#/components/schemas/AdminUserEconomy'
        suscripciones:
          type: array
          maxItems: 20
          items:
            type: object
        opositester:
          type: [object, 'null']
        debilidades:
          type: array
          maxItems: 15
          items:
            type: object
        seccionesNoDisponibles:
          type: array
          items:
            $ref: '#/components/schemas/AdminUserDetailSection'
    AdminUserEconomy:
      type: [object, 'null']
      required: [saldo, totalGastadoCentimos, numeroCompras, ticketsComprados, ticketsGanados, ticketsGastados, purchases]
      properties:
        saldo:
          type: integer
        totalGastadoCentimos:
          type: integer
        numeroCompras:
          type: integer
        ticketsComprados:
          type: integer
        ticketsGanados:
          type: integer
        ticketsGastados:
          type: integer
        costeCaptacionCentimos:
          type: [integer, 'null']
          description: 'Null until attribution or marketing cost data exists (GAP-041).'
        rentabilidadCentimos:
          type: [integer, 'null']
          description: 'Null until attribution or marketing cost data exists (GAP-041).'
        purchases:
          type: array
          maxItems: 20
          items:
            type: object
    AdminUserPatchRequest:
      type: object
      required: []
      additionalProperties: false
      properties:
        nombreMostrar:
          type: string
          maxLength: 100
          description: 'FA9 (text only): maxLength counts Unicode code points after trimming surrounding whitespace. A name that is blank after trimming is 400 VALIDATION (REQUIRED); one with control or invisible-format characters (Unicode categories Cc, Cf, Zl, Zp, lone surrogates) is 400 VALIDATION (INVALID_FORMAT).'
        username:
          $ref: '#/components/schemas/Username'
    RoleIdsBody:
      type: object
      required: [roleIds]
      additionalProperties: false
      properties:
        roleIds:
          type: array
          items:
            $ref: '../common/identifiers.yaml#/components/schemas/Uuid'
    AdminRoleSyncRequest:
      description: 'FA8: RoleIdsBody plus an optional precondition. expectedRoleIds = the role ids the editor saw; omitted means no precondition (previous behaviour).'
      type: object
      required: [roleIds]
      additionalProperties: false
      properties:
        roleIds:
          type: array
          maxItems: 50
          items:
            $ref: '../common/identifiers.yaml#/components/schemas/Uuid'
        expectedRoleIds:
          type: array
          maxItems: 50
          items:
            $ref: '../common/identifiers.yaml#/components/schemas/Uuid'
    AdminBlockRequest:
      type: object
      required: [motivo]
      additionalProperties: false
      properties:
        motivo:
          type: string
          minLength: 3
          maxLength: 500
    AdminBlockResponse:
      type: object
      required: [accountStatus, bloqueadoEn, bloqueadoPor]
      properties:
        accountStatus:
          type: string
          const: bloqueada
        bloqueadoEn:
          $ref: '../common/identifiers.yaml#/components/schemas/Instant'
        bloqueadoPor:
          $ref: '../common/identifiers.yaml#/components/schemas/Uuid'
    AdminUnblockResponse:
      type: object
      required: [accountStatus]
      properties:
        accountStatus:
          type: string
          const: activa
    Role:
      type: object
      required: [id, code, name, permissions]
      properties:
        id:
          $ref: '../common/identifiers.yaml#/components/schemas/Uuid'
        code:
          $ref: '../common/identifiers.yaml#/components/schemas/RoleCode'
        name:
          type: string
        description:
          type: [string, 'null']
        permissions:
          type: array
          items:
            type: string
    AdminLegalDocumentCreateRequest:
      type: object
      required: [tipo, version, titulo, contenido, activar]
      additionalProperties: false
      properties:
        tipo:
          $ref: '../common/identifiers.yaml#/components/schemas/LegalDocumentType'
        version:
          type: string
          minLength: 1
        titulo:
          type: string
          minLength: 1
        contenido:
          $ref: '../common/identifiers.yaml#/components/schemas/Markdown'
        activar:
          type: boolean
    AdminLegalDocumentCreated:
      type: object
      required: [id, tipo, version, activo]
      properties:
        id:
          $ref: '../common/identifiers.yaml#/components/schemas/Uuid'
        tipo:
          $ref: '../common/identifiers.yaml#/components/schemas/LegalDocumentType'
        version:
          type: string
        activo:
          type: boolean
        publicadoEn:
          type: [string, 'null']
          format: date-time
