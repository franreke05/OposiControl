# COMMUNITY read contracts of the app (FA15): D5-01 (OposiRed category catalog) and D5-16 (own OposiTester counters).
# Source of truth: categorias_oposired and estado_opositester_usuario. The user is always the JWT sub.
# The forum itself (feed, posts, comments, reactions: D5-02..D5-13) depends on open product decisions and is not here.
components:
  pathItems:
    OposiRedCategories:
      get:
        operationId: listOposiRedCategories
        summary: 'List the active OposiRed categories'
        tags: [community]
        x-contract-id: D5-01
        x-implementation: TARGET
        x-slice: null
        x-roles: [USER]
        x-pagination: NONE
        x-idempotency: NONE
        x-error-codes: [UNAUTHENTICATED, ACCOUNT_BLOCKED, ACCOUNT_DELETION_PENDING, PROFILE_MISSING, UPSTREAM_ERROR, UPSTREAM_CONTRACT_ERROR, UPSTREAM_UNAVAILABLE]
        description: 'Bounded catalog: only active categories, ordered by posicion then nombre, at most 50 (server cap, no pagination). The same list for every user. Cache private, max-age=300.'
        security:
          - bearerAuth: []
        responses:
          '200':
            description: 'Active categories.'
            headers:
              Cache-Control:
                $ref: '#/components/headers/PrivateMaxAge300'
            content:
              application/json:
                schema:
                  type: object
                  required: [items]
                  properties:
                    items:
                      type: array
                      maxItems: 50
                      items:
                        $ref: '#/components/schemas/OposiRedCategoria'
          '401':
            $ref: '../common/errors.yaml#/components/responses/Unauthenticated'
          '403':
            $ref: '../common/errors.yaml#/components/responses/Forbidden'
          '502':
            $ref: '../common/errors.yaml#/components/responses/UpstreamError'
          '503':
            $ref: '../common/errors.yaml#/components/responses/UpstreamUnavailable'
    QuestionFeedback:
      post:
        operationId: reportQuestion
        summary: 'Report a question (feedback on an exam question)'
        tags: [community]
        x-contract-id: D5-15
        x-implementation: TARGET
        x-slice: 5
        x-roles: [USER]
        x-pagination: NONE
        x-idempotency: OPTIONAL
        x-error-codes: [VALIDATION, IDEMPOTENCY_KEY_INVALID, UNAUTHENTICATED, ACCOUNT_BLOCKED, ACCOUNT_DELETION_PENDING, PROFILE_MISSING, ATTEMPT_NOT_FOUND, QUESTION_NOT_IN_ATTEMPT, IDEMPOTENCY_KEY_IN_PROGRESS, IDEMPOTENCY_KEY_REUSED, RATE_LIMITED, UPSTREAM_UNAVAILABLE]
        description: 'FA24 (V1, E3 Reportar). NOT deprecated: this is the live, supported contract of the existing route (it was only listed as legacy). Creates ONE pending report that the admin sees in Control. The user is always the JWT sub. intentoId is REQUIRED: only an attempt of the caller proves access to the exam, and the question must belong to that attempt exam (422 QUESTION_NOT_IN_ATTEMPT, never a 5xx; an attempt that is not the caller is 404 ATTEMPT_NOT_FOUND). tipoFeedback is the closed vocabulary of the database CHECK (default otro); descripcion at most 2000 code points. IDEMPOTENCY: an optional Idempotency-Key (UUID); the same key and the same body return the same report (same id, Idempotent-Replayed: true, nothing is written twice), the same key with another body is 422 IDEMPOTENCY_KEY_REUSED; without a key every call creates a report. Per-user limits: 10 per minute and 50 per day (429 RATE_LIMITED with Retry-After).'
        security:
          - bearerAuth: []
        parameters:
          - $ref: '../common/idempotency.yaml#/components/parameters/IdempotencyKeyOptional'
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestionFeedbackRequest'
        responses:
          '201':
            description: 'Report created (or replayed with the same key and body).'
            headers:
              Idempotent-Replayed:
                $ref: '../common/idempotency.yaml#/components/headers/IdempotentReplayed'
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/QuestionFeedbackCreated'
          '400':
            $ref: '../common/errors.yaml#/components/responses/BadRequest'
            description: 'VALIDATION (including a missing intentoId) or IDEMPOTENCY_KEY_INVALID.'
          '401':
            $ref: '../common/errors.yaml#/components/responses/Unauthenticated'
          '403':
            $ref: '../common/errors.yaml#/components/responses/Forbidden'
          '404':
            $ref: '../common/errors.yaml#/components/responses/NotFound'
            description: 'ATTEMPT_NOT_FOUND (also an attempt of another user).'
          '409':
            $ref: '../common/errors.yaml#/components/responses/Conflict'
            description: 'IDEMPOTENCY_KEY_IN_PROGRESS.'
          '422':
            $ref: '../common/errors.yaml#/components/responses/UnprocessableEntity'
            description: 'QUESTION_NOT_IN_ATTEMPT or IDEMPOTENCY_KEY_REUSED.'
          '429':
            $ref: '../common/errors.yaml#/components/responses/RateLimited'
          '503':
            $ref: '../common/errors.yaml#/components/responses/UpstreamUnavailable'
    OposiTesterMe:
      get:
        operationId: getMyOposiTesterStatus
        summary: 'Get the OposiTester counters of the current user'
        tags: [community]
        x-contract-id: D5-16
        x-implementation: TARGET
        x-slice: null
        x-roles: [USER]
        x-pagination: NONE
        x-idempotency: NONE
        x-error-codes: [UNAUTHENTICATED, ACCOUNT_BLOCKED, ACCOUNT_DELETION_PENDING, PROFILE_MISSING, UPSTREAM_ERROR, UPSTREAM_CONTRACT_ERROR, UPSTREAM_UNAVAILABLE]
        description: 'Bare object (no data wrapper). Own counters only: the row of the JWT sub. A user who never sent a report has no row and gets zeros. nivel is null until DEC-028 defines the levels (value only). Cache private, no-store.'
        security:
          - bearerAuth: []
        responses:
          '200':
            description: 'Own OposiTester counters.'
            headers:
              Cache-Control:
                $ref: '#/components/headers/PrivateNoStore'
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/OposiTesterEstado'
          '401':
            $ref: '../common/errors.yaml#/components/responses/Unauthenticated'
          '403':
            $ref: '../common/errors.yaml#/components/responses/Forbidden'
          '502':
            $ref: '../common/errors.yaml#/components/responses/UpstreamError'
          '503':
            $ref: '../common/errors.yaml#/components/responses/UpstreamUnavailable'
  headers:
    PrivateNoStore:
      description: 'private, no-store'
      required: true
      schema:
        type: string
        enum: ['private, no-store']
    PrivateMaxAge300:
      description: 'private, max-age=300'
      required: true
      schema:
        type: string
        enum: ['private, max-age=300']
  schemas:
    QuestionFeedbackRequest:
      type: object
      required: [preguntaId, intentoId]
      additionalProperties: false
      properties:
        preguntaId:
          $ref: '../common/identifiers.yaml#/components/schemas/Uuid'
        intentoId:
          $ref: '../common/identifiers.yaml#/components/schemas/Uuid'
        tipoFeedback:
          type: string
          enum: [mal_redactada, respuesta_incorrecta, explicacion_insuficiente, fuente_dudosa, recurso_roto, otro]
          description: 'Closed vocabulary of the database CHECK; absent or blank means otro.'
        descripcion:
          type: string
          maxLength: 2000
    QuestionFeedbackCreated:
      type: object
      required: [ok, id]
      properties:
        ok:
          type: boolean
        id:
          $ref: '../common/identifiers.yaml#/components/schemas/Uuid'
    OposiRedCategoria:
      type: object
      required: [id, nombre, slug, posicion]
      properties:
        id:
          $ref: '../common/identifiers.yaml#/components/schemas/Uuid'
        nombre:
          type: string
        slug:
          type: string
        descripcion:
          type: [string, 'null']
        posicion:
          type: integer
    OposiTesterEstado:
      type: object
      required: [reportesEnviados, reportesValidados, ticketsGanados]
      properties:
        reportesEnviados:
          type: integer
          minimum: 0
        reportesValidados:
          type: integer
          minimum: 0
        ticketsGanados:
          type: integer
          minimum: 0
        nivel:
          type: [string, 'null']
          description: 'null until DEC-028 (OposiTester levels).'
