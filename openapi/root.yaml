openapi: 3.1.0
info:
  title: OposiBots canonical API (Slice 0 frozen subset)
  version: 0.1.0-slice0
  summary: 'FROZEN contracts of the canonical API redesign, one logical Ktor backend.'
  description: 'Generated by hand from the frozen redesign dataset (contracts with status FROZEN only, plus CF-01 start/resume and CF-02 review). Canonical vocabulary: exam types rafaga|razonado|inmersivo, question types rafaga|razonada|inmersiva; specialty belongs to the exam only. Every non-2xx JSON response uses common/errors.yaml ErrorEnvelope. Operation extensions: x-contract-id (frozen contract id), x-roles, x-pagination (CURSOR|OFFSET|CURSOR_NESTED|NONE), x-idempotency (REQUIRED|OPTIONAL|NATURAL|NONE), x-error-codes, x-implementation (LIVE|TARGET), x-slice (integer slice of 17_IMPLEMENTATION_PLAN that implements it, or null when that plan does not schedule it yet). TARGET operations describe the post-migration wire format, which the live server does not serve yet; only LIVE operations (x-slice 0) match what Ktor serves today. D7-25 EntitlementPolicy.check is in-process and has no route. Blocked contracts (for example quick quiz D2-04 on DEC-021 and pause/resume on DEC-014) are intentionally absent. FA11 adds, as TARGET, the news administration D4-01..D4-11 and the wallet reads D6-01 and D6-02; their sibling contracts that depend on an open product decision (app news feed D4-18 on DEC-030, wallet commands on DEC-035, DEC-036 and DEC-031) stay absent. FA12 adds, as TARGET, the moderation reads D5-20, D5-21, D5-22, D5-25, D5-26, D5-28 and D5-29: they are served at the paths the OposiControl client already calls, so their wire only grows (legacy duplicates are marked deprecated); and the admin subscription list D7-27. FA13 adds, as TARGET, the admin catalog reads D7-17, D7-21, D6-18, D6-20 and D6-22 and the dashboard overview D3-15, all at the paths the OposiControl client already calls with the field names it already reads; and two catalog writes on new paths, the plan upsert D7-22 and the tariff upsert D7-19. FA14 adds, as TARGET, the promotion use log D7-29. FA15 adds, as TARGET, three read-only app contracts bound to the JWT sub (billing history D7-05, OposiRed category catalog D5-01 and own OposiTester counters D5-16) and the commercial product upsert D7-18 on a new path, with the field names D7-17 emits. FA22 (V1 economy, owner scope change 2026-10-15) adds, as TARGET, the OposiTickets commands: redeem an exam D6-03 (Idempotency-Key required), the ticket packs D6-11, payment orders D6-12/D6-13/D6-14 and the provider webhook W-01 (authenticated by signature, no JWT), in economy/economy.yaml; the 409/422 economy codes INSUFFICIENT_BALANCE, PRICE_CHANGED, ALREADY_ACCESSIBLE, NOT_PURCHASABLE, PRODUCT_NOT_AVAILABLE, PAYMENT_PROVIDER_UNAVAILABLE, ORDER_NOT_FOUND, PAYMENT_RECEIPT_INVALID and WEBHOOK_SIGNATURE_INVALID in errors.yaml, and ErrorDetails.balance and ErrorDetails.price.'
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: /
    description: 'Same origin as the Ktor backend (one logical backend).'
