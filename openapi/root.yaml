  - name: profiles
    description: 'Current user profile, onboarding and legal documents.'
  - name: profiles-admin
    description: 'Staff identity, user administration and roles.'
  - name: catalog
    description: 'Published exam catalog for the app and public readers.'
  - name: catalog-admin
    description: 'Exam, question, specialty, community, tag and import administration.'
  - name: entitlements
    description: 'Current user entitlement.'
  - name: entitlements-admin
    description: 'Exam access grants administration.'
  - name: attempts
    description: 'Exam engine: attempts, answers, results and review.'
  - name: news-admin
    description: 'News articles, news types and news assets administration.'
  - name: wallet
    description: 'OposiTickets wallet of the current user (reads).'
  - name: payments
    description: 'Payment orders of the current user and the provider notification (V1 economy).'
  - name: moderation-admin
    description: 'Forum threads, content reports and question feedback for moderation (reads).'
  - name: commerce-admin
    description: 'Subscriptions and commercial catalog administration.'
  - name: dashboard-admin
    description: 'Admin dashboard overview.'
  - name: billing
    description: 'Purchases and subscriptions of the current user (reads).'
  - name: community
    description: 'OposiRed category catalog and own OposiTester counters (reads).'
