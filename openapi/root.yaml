openapi: 3.1.0
info:
  title: OposiBots canonical API (Slice 0 frozen subset)
  version: 0.1.0-slice0
  summary: 'FROZEN contracts of the canonical API redesign, one logical Ktor backend.'
  description: 'Generated by hand from the frozen redesign dataset (contracts with status FROZEN only, plus CF-01 start/resume and CF-02 review). Canonical vocabulary: exam types rafaga|razonado|inmersivo, question types rafaga|razonada|inmersiva; specialty belongs to the exam only. Every non-2xx JSON response uses common/errors.yaml ErrorEnvelope. Operation extensions: x-contract-id (frozen contract id), x-roles, x-pagination (CURSOR|OFFSET|CURSOR_NESTED|NONE), x-idempotency (REQUIRED|OPTIONAL|NATURAL|NONE), x-error-codes, x-implementation (LIVE|TARGET), x-slice (integer slice of 17_IMPLEMENTATION_PLAN that implements it, or null when that plan does not schedule it yet). TARGET operations describe the post-migration wire format, which the live server does not serve yet; only LIVE operations (x-slice 0) match what Ktor serves today. D7-25 EntitlementPolicy.check is in-process and has no route. Blocked contracts (for example quick quiz D2-04 on DEC-021 and pause/resume on DEC-014) are intentionally absent. FA11 adds, as TARGET, the news administration D4-01..D4-11 and the wallet reads D6-01 and D6-02; their sibling contracts that depend on an open product decision (app news feed D4-18 on DEC-030, wallet commands on DEC-035, DEC-036 and DEC-031) stay absent.'
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: /
    description: 'Same origin as the Ktor backend (one logical backend).'
tags:
  - name: foundation
    description: 'Health, metrics, system status and audit log.'
  - name: auth
    description: 'Public authentication endpoints (/v1/auth).'
  - name: profiles
    description: 'Current user profile, onboarding and legal documents.'
  - name: profiles-admin
    description: 'Staff identity, user administration and roles.'
  - name: catalog
    description: 'Published exam catalog for the app and public readers.'
  - name: catalog-admin
    description: 'Exam, question, specialty, community, tag and import administration.'
  - name: entitlements
    description: 'Current user entitlement.'
  - name: entitlements-admin
    description: 'Exam access grants administration.'
  - name: attempts
    description: 'Exam engine: attempts, answers, results and review.'
  - name: news-admin
    description: 'News articles, news types and news assets administration.'
  - name: wallet
    description: 'OposiTickets wallet of the current user (reads).'
