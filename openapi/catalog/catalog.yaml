# CATALOG contracts (FROZEN): D2-01, D2-02, D2-13, D2-15, D2-16, D2-17, D2-20..D2-60.
# Specialty (especialidadId) belongs to the EXAM only; question schemas never carry it.
components:
  pathItems:
    AppExams:
      get:
        operationId: listAppExams
        summary: 'List published exams for the app'
        tags: [catalog]
        x-contract-id: D2-01
        x-implementation: TARGET
        x-slice: 2
        x-roles: [USER]
        x-pagination: CURSOR
        x-idempotency: NONE
        x-error-codes: [VALIDATION, INVALID_CURSOR, UNAUTHENTICATED, RATE_LIMITED, INTERNAL, UPSTREAM_ERROR]
        description: 'Keyset (publicado_en desc, id). accessState comes from CheckExamAccess. The tipoExamen filter also accepts the legacy synonym of razonado on reads (normalized server-side, never emitted). especialidadId is a single-id filter, never a list; the specialty of an exam is fixed by the exam, and the user has exactly one active specialty (DEC-002).'
        security:
          - bearerAuth: []
        parameters:
          - name: tipoExamen
            in: query
            required: false
            schema:
              $ref: '../common/identifiers.yaml#/components/schemas/TipoExamen'
          - name: especialidadId
            in: query
            required: false
            schema:
              $ref: '../common/identifiers.yaml#/components/schemas/Uuid'
          - name: comunidadId
            in: query
            required: false
            schema:
              $ref: '../common/identifiers.yaml#/components/schemas/Uuid'
          - name: anio
            in: query
            required: false
            schema:
              type: integer
          - $ref: '../common/pagination.yaml#/components/parameters/Cursor'
          - $ref: '../common/pagination.yaml#/components/parameters/LimitApp'
          - name: includeFacets
            in: query
            required: false
            schema:
              type: boolean
              default: false
        responses:
          '200':
            description: 'Exam page.'
            content:
              application/json:
                schema:
                  allOf:
                    - $ref: '../common/pagination.yaml#/components/schemas/CursorPageEnvelope'
                    - type: object
                      required: [items]
                      properties:
                        items:
                          type: array
                          items:
                            $ref: '#/components/schemas/AppExamSummary'
                        facets:
                          $ref: '#/components/schemas/AppExamFacets'
          '400':
            $ref: '../common/errors.yaml#/components/responses/BadRequest'
          '401':
            $ref: '../common/errors.yaml#/components/responses/Unauthenticated'
          '429':
            $ref: '../common/errors.yaml#/components/responses/RateLimited'
          '500':
            $ref: '../common/errors.yaml#/components/responses/Internal'
          '502':
            $ref: '../common/errors.yaml#/components/responses/UpstreamError'
          '503':
            $ref: '../common/errors.yaml#/components/responses/UpstreamUnavailable'
    AppExam:
      get:
        operationId: getAppExam
        summary: 'Get a published exam for the app'
        tags: [catalog]
        x-contract-id: D2-02
        x-implementation: TARGET
        x-slice: 2
        x-roles: [USER]
        x-pagination: NONE
        x-idempotency: NONE
        x-error-codes: [VALIDATION, UNAUTHENTICATED, EXAM_NOT_FOUND, INTERNAL, UPSTREAM_ERROR]
        description: 'No question bodies. FA23 (owner 2026-10-16): an exam outside the caller specialty is 404 EXAM_NOT_FOUND here and absent from the lists (D2-01, D2-13 are scoped to the own specialty; another specialty returns an empty page). precio is the OT price stored in the database (FA22, null when not purchasable) and accesoValidoHasta the server-decided end of the caller access. Cache private, no-store for accessState. intentoAbiertoId and ultimoIntentoFinalizadoId (FA19) come from one bounded read of the caller attempts on this exam (command-created only).'
        security:
          - bearerAuth: []
        parameters:
          - $ref: '../common/identifiers.yaml#/components/parameters/ExamIdPath'
        responses:
          '200':
            description: 'Exam.'
            content:
              application/json:
                schema:
                  type: object
                  required: [examen]
                  properties:
                    examen:
                      $ref: '#/components/schemas/AppExamDetail'
          '400':
            $ref: '../common/errors.yaml#/components/responses/BadRequest'
          '401':
            $ref: '../common/errors.yaml#/components/responses/Unauthenticated'
          '429':
            $ref: '../common/errors.yaml#/components/responses/RateLimited'
            description: 'RATE_LIMITED (FA20, per-user read limit; Retry-After).'
          '404':
            $ref: '../common/errors.yaml#/components/responses/NotFound'
            description: 'EXAM_NOT_FOUND (also draft or archived).'
          '500':
            $ref: '../common/errors.yaml#/components/responses/Internal'
          '502':
            $ref: '../common/errors.yaml#/components/responses/UpstreamError'
          '503':
            $ref: '../common/errors.yaml#/components/responses/UpstreamUnavailable'
    MyExams:
      get:
        operationId: listMyExams
        summary: 'List the current user exams by view'
        tags: [catalog]
        x-contract-id: D2-13
        x-implementation: TARGET
        x-slice: 2
        x-roles: [USER]
        x-pagination: CURSOR
        x-idempotency: NONE
        x-error-codes: [VALIDATION, INVALID_CURSOR, UNAUTHENTICATED]
        description: 'Self from JWT sub. Projection over intentos_examen, contenido_desbloqueado_usuario and examenes.'
        security:
          - bearerAuth: []
        parameters:
          - name: vista
            in: query
            required: true
            schema:
              type: string
              enum: [EN_CURSO, ADQUIRIDOS, COLECCION]
          - name: tipoExamen
            in: query
            required: false
            schema:
              $ref: '../common/identifiers.yaml#/components/schemas/TipoExamen'
          - name: comunidadId
            in: query
            required: false
            schema:
              $ref: '../common/identifiers.yaml#/components/schemas/Uuid'
          - name: anio
            in: query
            required: false
            schema:
              type: integer
          - $ref: '../common/pagination.yaml#/components/parameters/Cursor'
          - $ref: '../common/pagination.yaml#/components/parameters/LimitApp'
        responses:
          '200':
            description: 'My exams page.'
            content:
              application/json:
                schema:
                  allOf:
                    - $ref: '../common/pagination.yaml#/components/schemas/CursorPageEnvelope'
                    - type: object
                      required: [items]
                      properties:
                        items:
                          type: array
                          items:
                            $ref: '#/components/schemas/MyExamItem'
                        grupos:
                          type: [array, 'null']
                          items:
                            type: object
                            required: [comunidadCodigo, total]
                            properties:
                              comunidadCodigo:
                                type: string
                              comunidadNombre:
                                type: [string, 'null']
                                description: 'V1: readable community name (e.g. Comunidad de Madrid) served by the API; clients never show the raw code. Null only for legacy exams without a community.'
                              total:
                                type: integer
                                minimum: 0
          '400':
            $ref: '../common/errors.yaml#/components/responses/BadRequest'
          '401':
            $ref: '../common/errors.yaml#/components/responses/Unauthenticated'
          '429':
            $ref: '../common/errors.yaml#/components/responses/RateLimited'
            description: 'RATE_LIMITED (FA20, per-user read limit; Retry-After).'
          '503':
            $ref: '../common/errors.yaml#/components/responses/UpstreamUnavailable'
    PublicExams:
      get:
        operationId: listPublicExams
        summary: 'List published exams (public)'
        tags: [catalog]
        x-contract-id: D2-15
        x-implementation: TARGET
        x-slice: null
        x-roles: [ANON]
        x-pagination: CURSOR
        x-idempotency: NONE
        x-error-codes: [VALIDATION, INVALID_CURSOR, RATE_LIMITED, INTERNAL, UPSTREAM_ERROR]
        description: 'Published metadata only. Was OFFSET; a public list has no jump-to-page need.'
        security: []
        parameters:
          - name: especialidadId
            in: query
            required: false
            schema:
              $ref: '../common/identifiers.yaml#/components/schemas/Uuid'
          - name: comunidadId
            in: query
            required: false
            schema:
              $ref: '../common/identifiers.yaml#/components/schemas/Uuid'
          - name: tipoExamen
            in: query
            required: false
            schema:
              $ref: '../common/identifiers.yaml#/components/schemas/TipoExamen'
          - name: tipoAcceso
            in: query
            required: false
            schema:
              $ref: '../common/identifiers.yaml#/components/schemas/TipoAcceso'
          - $ref: '../common/pagination.yaml#/components/parameters/Cursor'
          - $ref: '../common/pagination.yaml#/components/parameters/LimitApp'
        responses:
          '200':
            description: 'Public exam page.'
            content:
              application/json:
                schema:
                  allOf:
                    - $ref: '../common/pagination.yaml#/components/schemas/CursorPageEnvelope'
                    - type: object
                      required: [items]
                      properties:
                        items:
                          type: array
                          items:
                            $ref: '#/components/schemas/PublicExamSummary'
          '400':
            $ref: '../common/errors.yaml#/components/responses/BadRequest'
          '429':
            $ref: '../common/errors.yaml#/components/responses/RateLimited'
          '500':
            $ref: '../common/errors.yaml#/components/responses/Internal'
          '502':
            $ref: '../common/errors.yaml#/components/responses/UpstreamError'
    PublicExam:
      get:
        operationId: getPublicExam
        summary: 'Get a published exam (public)'
        tags: [catalog]
        x-contract-id: D2-16
        x-implementation: TARGET
        x-slice: null
        x-roles: [ANON]
        x-pagination: NONE
        x-idempotency: NONE
        x-error-codes: [VALIDATION, EXAM_NOT_FOUND, RATE_LIMITED]
        description: 'No questions. Cache public, max-age 300.'
        security: []
        parameters:
          - $ref: '../common/identifiers.yaml#/components/parameters/ExamIdPath'
        responses:
          '200':
            description: 'Exam.'
            content:
              application/json:
                schema:
                  type: object
                  required: [examen]
                  properties:
                    examen:
                      $ref: '#/components/schemas/PublicExamDetail'
          '400':
            $ref: '../common/errors.yaml#/components/responses/BadRequest'
          '404':
            $ref: '../common/errors.yaml#/components/responses/NotFound'
            description: 'EXAM_NOT_FOUND.'
          '429':
            $ref: '../common/errors.yaml#/components/responses/RateLimited'
    PublicSpecialties:
      get:
        operationId: listPublicSpecialties
        summary: 'List active specialties (public)'
        tags: [catalog]
        x-contract-id: D2-17
        x-implementation: TARGET
        x-slice: null
        x-roles: [ANON]
        x-pagination: NONE
        x-idempotency: NONE
        x-error-codes: [RATE_LIMITED, INTERNAL, UPSTREAM_ERROR]
        description: 'Bounded catalog of active specialties with their capabilities. ids are the real especialidades ids (the ones of the profile and of D2-01 especialidadId). Served by Ktor since 2026-10-14 (FA19), public cache.'
        security: []
        responses:
          '200':
            description: 'Specialties.'
            content:
              application/json:
                schema:
                  type: object
                  required: [items]
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/PublicSpecialty'
          '429':
            $ref: '../common/errors.yaml#/components/responses/RateLimited'
          '500':
            $ref: '../common/errors.yaml#/components/responses/Internal'
          '502':
            $ref: '../common/errors.yaml#/components/responses/UpstreamError'
    AdminExams:
      get:
        operationId: listAdminExams
        summary: 'List exams (admin grid)'
        tags: [catalog-admin]
        x-contract-id: D2-20
        x-implementation: TARGET
        x-slice: 2
        x-roles: [ADMIN]
        x-pagination: OFFSET
        x-idempotency: NONE
        x-error-codes: [VALIDATION, UNAUTHENTICATED, FORBIDDEN]
        security:
          - bearerAuth: []
        parameters:
          - name: q
            in: query
            required: false
            schema:
              type: string
          - name: estado
            in: query
            required: false
            schema:
              $ref: '../common/identifiers.yaml#/components/schemas/ExamEstado'
          - name: tipoExamen
            in: query
            required: false
            schema:
              $ref: '../common/identifiers.yaml#/components/schemas/TipoExamen'
          - name: especialidadId
            in: query
            required: false
            schema:
              $ref: '../common/identifiers.yaml#/components/schemas/Uuid'
          - name: comunidadId
            in: query
            required: false
            schema:
              $ref: '../common/identifiers.yaml#/components/schemas/Uuid'
          - name: etiquetaId
            in: query
            required: false
            schema:
              $ref: '../common/identifiers.yaml#/components/schemas/Uuid'
          - $ref: '../common/pagination.yaml#/components/parameters/LimitOffset100Default25'
          - $ref: '../common/pagination.yaml#/components/parameters/Offset'
        responses:
          '200':
            description: 'Exam page.'
            content:
              application/json:
                schema:
                  allOf:
                    - $ref: '../common/pagination.yaml#/components/schemas/OffsetPageEnvelope'
                    - type: object
                      required: [items]
                      properties:
                        items:
                          type: array
                          items:
                            $ref: '#/components/schemas/AdminExamen'
          '400':
            $ref: '../common/errors.yaml#/components/responses/BadRequest'
          '401':
            $ref: '../common/errors.yaml#/components/responses/Unauthenticated'
          '403':
            $ref: '../common/errors.yaml#/components/responses/Forbidden'
      post:
        operationId: createAdminExam
        summary: 'Create an exam'
        tags: [catalog-admin]
        x-contract-id: D2-22
        x-implementation: TARGET
        x-slice: 2
        x-roles: [ADMIN]
        x-pagination: NONE
        x-idempotency: REQUIRED
        x-error-codes: [VALIDATION, IDEMPOTENCY_KEY_REQUIRED, IDEMPOTENCY_KEY_INVALID, UNAUTHENTICATED, FORBIDDEN, EXAM_CODE_DUPLICATE, IDEMPOTENCY_KEY_IN_PROGRESS, SPECIALTY_TYPE_NOT_ALLOWED, IDEMPOTENCY_KEY_REUSED]
        description: 'Idempotency-Key (canonical store); codigoExamen is unique.'
        security:
          - bearerAuth: []
        parameters:
          - $ref: '../common/idempotency.yaml#/components/parameters/IdempotencyKeyRequired'
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminExamenCreateRequest'
        responses:
          '201':
            description: 'Created.'
            headers:
              Location:
                description: 'URI of the created exam.'
                required: true
                schema:
                  type: string
              Idempotent-Replayed:
                $ref: '../common/idempotency.yaml#/components/headers/IdempotentReplayed'
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/AdminExamen'
          '400':
            $ref: '../common/errors.yaml#/components/responses/BadRequest'
          '401':
            $ref: '../common/errors.yaml#/components/responses/Unauthenticated'
          '403':
            $ref: '../common/errors.yaml#/components/responses/Forbidden'
          '409':
            $ref: '../common/errors.yaml#/components/responses/Conflict'
            description: 'EXAM_CODE_DUPLICATE or IDEMPOTENCY_KEY_IN_PROGRESS.'
          '422':
            $ref: '../common/errors.yaml#/components/responses/UnprocessableEntity'
            description: 'SPECIALTY_TYPE_NOT_ALLOWED or IDEMPOTENCY_KEY_REUSED.'
    AdminExam:
      parameters:
        - $ref: '../common/identifiers.yaml#/components/parameters/ExamIdPath'
      get:
        operationId: getAdminExam
        summary: 'Get an exam (admin)'
        tags: [catalog-admin]
        x-contract-id: D2-21
        x-implementation: TARGET
        x-slice: 2
        x-roles: [ADMIN]
        x-pagination: NONE
        x-idempotency: NONE
        x-error-codes: [VALIDATION, UNAUTHENTICATED, FORBIDDEN, EXAM_NOT_FOUND]
        description: 'All fields including drafts, creadoPor and signed portadaUrl.'
        security:
          - bearerAuth: []
        responses:
          '200':
            description: 'Exam.'
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/AdminExamen'
          '400':
            $ref: '../common/errors.yaml#/components/responses/BadRequest'
          '401':
            $ref: '../common/errors.yaml#/components/responses/Unauthenticated'
          '403':
            $ref: '../common/errors.yaml#/components/responses/Forbidden'
          '404':
            $ref: '../common/errors.yaml#/components/responses/NotFound'
            description: 'EXAM_NOT_FOUND.'
      patch:
        operationId: updateAdminExam
        summary: 'Update exam metadata'
        tags: [catalog-admin]
        x-contract-id: D2-23
        x-implementation: TARGET
        x-slice: 2
        x-roles: [ADMIN]
        x-pagination: NONE
        x-idempotency: NATURAL
        x-error-codes: [VALIDATION, UNAUTHENTICATED, FORBIDDEN, EXAM_NOT_FOUND, EXAM_TYPE_LOCKED_BY_QUESTIONS, SPECIALTY_TYPE_NOT_ALLOWED]
        description: 'Partial metadata update; tipoExamen is locked once questions are linked. Publication state changes only through the publicar/despublicar/archivar commands.'
        security:
          - bearerAuth: []
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminExamenPatchRequest'
        responses:
          '200':
            description: 'Exam.'
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/AdminExamen'
          '400':
            $ref: '../common/errors.yaml#/components/responses/BadRequest'
          '401':
            $ref: '../common/errors.yaml#/components/responses/Unauthenticated'
          '403':
            $ref: '../common/errors.yaml#/components/responses/Forbidden'
          '404':
            $ref: '../common/errors.yaml#/components/responses/NotFound'
            description: 'EXAM_NOT_FOUND.'
          '409':
            $ref: '../common/errors.yaml#/components/responses/Conflict'
            description: 'EXAM_TYPE_LOCKED_BY_QUESTIONS.'
          '422':
            $ref: '../common/errors.yaml#/components/responses/UnprocessableEntity'
      delete:
        operationId: deleteAdminExam
        summary: 'Delete an exam without user data'
        tags: [catalog-admin]
        x-contract-id: D2-24
        x-implementation: TARGET
        x-slice: 2
        x-roles: [ADMIN]
        x-pagination: NONE
        x-idempotency: NATURAL
        x-error-codes: [UNAUTHENTICATED, FORBIDDEN, EXAM_NOT_FOUND, EXAM_HAS_USER_DATA, EXAM_DELETE_GUARD_UNAVAILABLE]
        description: 'A 404 on retry is treated as done. Exams with user data must be archived instead.'
        security:
          - bearerAuth: []
        responses:
          '204':
            description: 'Deleted.'
          '401':
            $ref: '../common/errors.yaml#/components/responses/Unauthenticated'
          '403':
            $ref: '../common/errors.yaml#/components/responses/Forbidden'
          '404':
            $ref: '../common/errors.yaml#/components/responses/NotFound'
            description: 'EXAM_NOT_FOUND.'
          '409':
            $ref: '../common/errors.yaml#/components/responses/Conflict'
            description: 'EXAM_HAS_USER_DATA (use archivar) or EXAM_DELETE_GUARD_UNAVAILABLE.'
    AdminExamPublish:
      post:
        operationId: publishAdminExam
        summary: 'Publish an exam'
        tags: [catalog-admin]
        x-contract-id: D2-25
        x-implementation: TARGET
        x-slice: 2
        x-roles: [ADMIN]
        x-pagination: NONE
        x-idempotency: NATURAL
        x-error-codes: [UNAUTHENTICATED, FORBIDDEN, EXAM_NOT_FOUND, EXAM_PUBLISH_REQUIRES_QUESTIONS, EXAM_PUBLISH_IMMERSIVE_WITHOUT_AUDIO]
        description: 'Idempotent by state.'
        security:
          - bearerAuth: []
        parameters:
          - $ref: '../common/identifiers.yaml#/components/parameters/ExamIdPath'
        requestBody:
          required: false
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminExamPublishRequest'
        responses:
          '200':
            description: 'Exam.'
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/AdminExamen'
          '401':
            $ref: '../common/errors.yaml#/components/responses/Unauthenticated'
          '403':
            $ref: '../common/errors.yaml#/components/responses/Forbidden'
          '404':
            $ref: '../common/errors.yaml#/components/responses/NotFound'
            description: 'EXAM_NOT_FOUND.'
          '409':
            $ref: '../common/errors.yaml#/components/responses/Conflict'
            description: 'EXAM_PUBLISH_REQUIRES_QUESTIONS.'
          '422':
            $ref: '../common/errors.yaml#/components/responses/UnprocessableEntity'
            description: 'EXAM_PUBLISH_IMMERSIVE_WITHOUT_AUDIO.'
    AdminExamUnpublish:
      post:
        operationId: unpublishAdminExam
        summary: 'Unpublish an exam'
        tags: [catalog-admin]
        x-contract-id: D2-26
        x-implementation: TARGET
        x-slice: null
        x-roles: [ADMIN]
        x-pagination: NONE
        x-idempotency: NATURAL
        x-error-codes: [UNAUTHENTICATED, FORBIDDEN, EXAM_NOT_FOUND]
        description: 'Idempotent by state.'
        security:
          - bearerAuth: []
        parameters:
          - $ref: '../common/identifiers.yaml#/components/parameters/ExamIdPath'
        responses:
          '200':
            description: 'Exam.'
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/AdminExamen'
          '401':
            $ref: '../common/errors.yaml#/components/responses/Unauthenticated'
          '403':
            $ref: '../common/errors.yaml#/components/responses/Forbidden'
          '404':
            $ref: '../common/errors.yaml#/components/responses/NotFound'
            description: 'EXAM_NOT_FOUND.'
    AdminExamArchive:
      post:
        operationId: archiveAdminExam
        summary: 'Archive an exam'
        tags: [catalog-admin]
        x-contract-id: D2-27
        x-implementation: TARGET
        x-slice: null
        x-roles: [ADMIN]
        x-pagination: NONE
        x-idempotency: NATURAL
        x-error-codes: [UNAUTHENTICATED, FORBIDDEN, EXAM_NOT_FOUND]
        description: 'Idempotent by state.'
        security:
          - bearerAuth: []
        parameters:
          - $ref: '../common/identifiers.yaml#/components/parameters/ExamIdPath'
        responses:
          '200':
            description: 'Exam.'
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/AdminExamen'
          '401':
            $ref: '../common/errors.yaml#/components/responses/Unauthenticated'
          '403':
            $ref: '../common/errors.yaml#/components/responses/Forbidden'
          '404':
            $ref: '../common/errors.yaml#/components/responses/NotFound'
            description: 'EXAM_NOT_FOUND.'
    AdminExamCover:
      parameters:
        - $ref: '../common/identifiers.yaml#/components/parameters/ExamIdPath'
      post:
        operationId: uploadAdminExamCover
        summary: 'Upload or replace the exam cover'
        tags: [catalog-admin]
        x-contract-id: D2-28
        x-implementation: TARGET
        x-slice: null
        x-roles: [ADMIN]
        x-pagination: NONE
        x-idempotency: NATURAL
        x-error-codes: [NO_FILE, PAYLOAD_TOO_LARGE, UNAUTHENTICATED, FORBIDDEN, EXAM_NOT_FOUND, EXAM_COVER_CHANGED_CONCURRENTLY, EXAM_COVER_TYPE_INVALID]
        description: 'Conditional path update (If-Match with the current storage path) makes retries safe. image/jpeg, image/png or image/webp up to 10 MB.'
        security:
          - bearerAuth: []
        parameters:
          - name: If-Match
            in: header
            required: false
            description: 'Current cover path.'
            schema:
              type: string
        requestBody:
          required: true
          content:
            multipart/form-data:
              schema:
                $ref: '#/components/schemas/FileUpload'
              encoding:
                file:
                  contentType: 'image/jpeg, image/png, image/webp'
        responses:
          '200':
            description: 'Exam with signed portadaUrl.'
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/AdminExamen'
          '400':
            $ref: '../common/errors.yaml#/components/responses/BadRequest'
            description: 'NO_FILE.'
          '401':
            $ref: '../common/errors.yaml#/components/responses/Unauthenticated'
