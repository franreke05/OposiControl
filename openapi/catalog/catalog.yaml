  schemas:
    AppExamSummary:
      type: object
      required: [id, titulo, tipoExamen, tipoAcceso, especialidadId, totalPreguntas, accessState]
      properties:
        id:
          $ref: '../common/identifiers.yaml#/components/schemas/Uuid'
        titulo:
          type: string
        tipoExamen:
          $ref: '../common/identifiers.yaml#/components/schemas/TipoExamen'
        tipoAcceso:
          $ref: '../common/identifiers.yaml#/components/schemas/TipoAcceso'
        especialidadId:
          $ref: '../common/identifiers.yaml#/components/schemas/Uuid'
        comunidadCodigo:
          type: [string, 'null']
        comunidadNombre:
          type: [string, 'null']
          description: 'V1: readable community name (e.g. Comunidad de Madrid) served by the API; clients never show the raw code. Null only for legacy exams without a community.'
        totalPreguntas:
          type: integer
          minimum: 0
        anio:
          type: [integer, 'null']
        duracionMinutos:
          type: [integer, 'null']
          minimum: 0
        portadaUrl:
          type: [string, 'null']
          format: uri
        accessState:
          $ref: '../common/identifiers.yaml#/components/schemas/AccessState'
    AppExamFacets:
      type: [object, 'null']
      description: 'Present only when includeFacets=true.'
      required: [comunidades, anios, tipos]
      properties:
        comunidades:
          type: array
          items:
            type: string
        anios:
          type: array
          items:
            type: integer
        tipos:
          type: array
          items:
            $ref: '../common/identifiers.yaml#/components/schemas/TipoExamen'
    ExamPrice:
      type: [object, 'null']
      description: 'FA22 (V1): the OposiTickets price and access days exactly as stored in the database, only when the exam is paid, purchasable with tickets and BOTH values are set; null otherwise (a price is never invented). The wallet redeem D6-03 charges this value.'
      required: [tickets, diasAcceso]
      properties:
        tickets:
          type: integer
          minimum: 0
        diasAcceso:
          type: integer
          minimum: 0
    AppExamDetail:
      type: object
      required: [id, codigoExamen, titulo, tipoExamen, tipoAcceso, especialidadId, totalPreguntas, accessState]
      properties:
        id:
          $ref: '../common/identifiers.yaml#/components/schemas/Uuid'
        codigoExamen:
          type: string
        titulo:
          type: string
        descripcion:
          type: [string, 'null']
        tipoExamen:
          $ref: '../common/identifiers.yaml#/components/schemas/TipoExamen'
        tipoAcceso:
          $ref: '../common/identifiers.yaml#/components/schemas/TipoAcceso'
        especialidadId:
          $ref: '../common/identifiers.yaml#/components/schemas/Uuid'
        comunidadCodigo:
          type: [string, 'null']
        comunidadNombre:
          type: [string, 'null']
          description: 'V1: readable community name (e.g. Comunidad de Madrid) served by the API; clients never show the raw code. Null only for legacy exams without a community.'
        duracionMinutos:
          type: [integer, 'null']
          minimum: 0
        totalPreguntas:
          type: integer
          minimum: 0
        anio:
          type: [integer, 'null']
        portadaUrl:
          type: [string, 'null']
          format: uri
        accessState:
          $ref: '../common/identifiers.yaml#/components/schemas/AccessState'
        intentoAbiertoId:
          type: [string, 'null']
          format: uuid
        ultimoIntentoFinalizadoId:
          type: [string, 'null']
          format: uuid
          description: 'FA19 (2026-10-14, PERF01): the most recent FINISHED attempt of the caller on this exam (result D2-12 / review D2-65), so a cover never pages D2-13. One bounded read on (usuario_id, examen_id); null when there is none.'
        precio:
          $ref: '#/components/schemas/ExamPrice'
        penalizacion:
          type: object
          required: [tipo]
          description: 'FA36: the penalty per wrong answer this exam applies (each attempt freezes it when it starts). Absent = no penalty. tipo FIJA = numerador/denominador per wrong answer; tipo RACIONAL = each wrong answer subtracts 1/(n-1) of a correct one (n = options of that question). Show it on the cover ("penaliza") before the user starts.'
