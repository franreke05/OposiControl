            tipo:
              type: string
              enum: [FIJA, RACIONAL]
            numerador:
              type: integer
              minimum: 1
            denominador:
              type: integer
              minimum: 1
        accesoValidoHasta:
          type: [string, 'null']
          format: date-time
          description: 'FA22 (V1): when the caller current access ends, decided by the server (database clock), when accessState is GRANTED with an end date; null when there is no grant or it does not expire. A re-purchase extends it from max(now, this end).'
