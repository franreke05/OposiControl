        motivoAnulacion:
          type: [string, 'null']
    StagingDuplicate:
      type: object
      required: [stagingId, preguntaId]
      properties:
        stagingId:
          $ref: '../common/identifiers.yaml#/components/schemas/Uuid'
        preguntaId:
          $ref: '../common/identifiers.yaml#/components/schemas/Uuid'
        codigoPregunta:
          type: [string, 'null']
        similitud:
          type: [number, 'null']
    AdminLoteDetail:
      allOf:
        - $ref: '#/components/schemas/AdminLote'
        - type: object
          required: [staging, duplicados, totales]
          properties:
            staging:
              allOf:
                - $ref: '../common/pagination.yaml#/components/schemas/CursorPageEnvelope'
                - type: object
                  required: [items]
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/AdminStagingItem'
            duplicados:
              allOf:
                - $ref: '../common/pagination.yaml#/components/schemas/CursorPageEnvelope'
                - type: object
                  required: [items]
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/StagingDuplicate'
            totales:
              $ref: '#/components/schemas/LoteResumen'
            archivoUrl:
              type: [string, 'null']
              format: uri
              description: 'Signed URL of the source file.'
    AdminStagingItemInput:
      type: object
      x-entity: pregunta
      required: [titulo, opciones, respuestaCorrecta]
      additionalProperties: false
      properties:
        posicion:
          type: integer
          minimum: 0
        titulo:
          type: string
          minLength: 1
        opciones:
          type: array
          minItems: 4
          maxItems: 4
          items:
            $ref: '#/components/schemas/OptionInput'
        respuestaCorrecta:
          $ref: '../common/identifiers.yaml#/components/schemas/OptionLetter'
        razonamiento:
          type: string
        fuenteTexto:
          type: string
        etiquetaTexto:
          type: string
        anulada:
          type: boolean
        motivoAnulacion:
          type: string
    AdminImportCreateRequest:
      type: object
      required: [examenId, nombreArchivo, tipoExamen, preguntas]
      additionalProperties: false
      properties:
        examenId:
          $ref: '../common/identifiers.yaml#/components/schemas/Uuid'
        nombreArchivo:
          type: string
          minLength: 1
        tipoExamen:
          $ref: '../common/identifiers.yaml#/components/schemas/TipoExamen'
        preguntas:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/AdminStagingItemInput'
    AdminImportPdfUpload:
      type: object
      required: [examenId, tipoExamen, file]
      properties:
        examenId:
          $ref: '../common/identifiers.yaml#/components/schemas/Uuid'
        tipoExamen:
          $ref: '../common/identifiers.yaml#/components/schemas/TipoExamen'
        file:
          type: string
          contentMediaType: application/pdf
    AdminStagingPatchRequest:
      type: object
      x-entity: pregunta
      required: []
      additionalProperties: false
      properties:
        enunciado:
          type: string
          minLength: 1
        opciones:
          type: array
          minItems: 4
          maxItems: 4
          items:
            $ref: '#/components/schemas/OptionInput'
        correcta:
          $ref: '../common/identifiers.yaml#/components/schemas/OptionLetter'
        estadoParseo:
          type: string
          enum: [aprobada, omitida]
        anulada:
          type: boolean
        motivo:
          type: string
    AdminImportRunRequest:
      type: object
      required: []
      additionalProperties: false
      properties:
        confirmarExamenPublicado:
          type: boolean
          default: false
    AdminImportRunResponse:
      type: object
      required: [lote, resultado]
      properties:
        lote:
          $ref: '#/components/schemas/AdminLote'
        resultado:
          type: object
          required: [ejecutado, nuevas, vinculadas, omitidas, totalImportadas, anuladas]
          properties:
            ejecutado:
              type: boolean
            nuevas:
              type: integer
              minimum: 0
            vinculadas:
              type: integer
              minimum: 0
            omitidas:
              type: integer
              minimum: 0
            totalImportadas:
              type: integer
              minimum: 0
            anuladas:
              type: integer
              minimum: 0
