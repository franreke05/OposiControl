name: ci
# Solo verificacion: sin despliegue y sin secretos. Acciones fijadas por SHA (comentario = etiqueta).
on:
  pull_request:
  push:
    branches: [main, 'feature/**']
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # MASTER4-CICD-003: solo los PR cancelan runs anteriores; un push a main/feature/** conserva su check completo.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  ops-static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - run: bash scripts/verify-ops-config.sh
      - run: bash scripts/verify-ops-config.test.sh
      - run: bash scripts/assert-clean-tree.test.sh
      - run: bash scripts/smoke-backend-image.test.sh
      # MASTER4-ARCH-002: el manifiesto Slice 1 (copia del de OposiBot) debe coincidir con supabase/migrations/2026093*.sql.
      - run: bash scripts/verify-migrations-manifest.sh
      - run: bash scripts/verify-migrations-manifest.test.sh
  # MASTER-SEC-014 / MASTER2-CICD-001: SCA del grafo RESUELTO de runtimeClasspath (BOMs, alias del catalogo y transitivas)
  # contra OSV; falla si el arbol no se puede interpretar o OSV no responde (sin secretos, sin dependencias nuevas).
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: gradle/actions/wrapper-validation@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
      - run: node --test scripts/osv-audit.test.mjs
      - run: ./gradlew :backend:ktor:dependencies --configuration runtimeClasspath -q > "$RUNNER_TEMP/runtime-deps.txt"
      # MASTER3-CICD-008: el self-test depende de api.osv.dev en vivo (flake); es informativo y NO bloquea. La auditoria real
      # de la linea siguiente sigue siendo fail-closed y el parser tiene su prueba unitaria sin red arriba.
      - run: node scripts/osv-audit.mjs --self-test
        continue-on-error: true
      - run: node scripts/osv-audit.mjs "$RUNNER_TEMP/runtime-deps.txt"
  openapi-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      # MASTER7-CICD-005: @redocly/cli y su arbol quedan fijados por tools/redocly/package-lock.json (`npm ci` falla si no coincide).
      - run: npm ci --prefix tools/redocly --ignore-scripts
      - run: npx --no-install --prefix tools/redocly redocly lint openapi/root.yaml --config openapi/redocly.yaml
  # MASTER7-CICD-001: deteccion de secretos en el historial (solo verificacion; paridad con OposiBot). Accion fijada por el SHA del
  # tag v2.3.9. Usa solo el GITHUB_TOKEN automatico del run (sin secretos del repositorio); si el repositorio pasa a ser de una
  # organizacion, la accion exige ademas GITLEAKS_LICENSE (ajuste externo, no incluido aqui).
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false, fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  # MASTER7-CICD-002: la imagen del backend se construye y ARRANCA en CI (solo verificacion: sin secretos, sin push ni despliegue).
  # build-backend-image.sh exige arbol limpio (no generar archivos antes); el humo comprueba uid 10001, /app no escribible y
  # /health/live = 200 con variables de relleno.
  backend-image:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: gradle/actions/wrapper-validation@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
      - run: bash scripts/build-backend-image.sh
      - run: bash scripts/smoke-backend-image.sh
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: gradle/actions/wrapper-validation@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
      - run: ./gradlew :backend:ktor:test :backend:dbtest:test :composeApp:compileKotlinJvm :data:jvmTest :domain:jvmTest :features:users:jvmTest --rerun-tasks --no-build-cache
