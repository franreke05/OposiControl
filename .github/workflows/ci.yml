name: ci
# Solo verificacion: sin despliegue y sin secretos. Acciones fijadas por SHA (comentario = etiqueta).
on:
  pull_request:
  push:
    branches: [main, 'feature/**']
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # MASTER4-CICD-003: solo los PR cancelan runs anteriores; un push a main/feature/** conserva su check completo.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  ops-static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - run: bash scripts/verify-ops-config.sh
      - run: bash scripts/verify-ops-config.test.sh
      - run: bash scripts/assert-clean-tree.test.sh
      - run: bash scripts/smoke-backend-image.test.sh
      # MASTER4-ARCH-002: el manifiesto Slice 1 (copia del de OposiBot) debe coincidir con supabase/migrations/2026093*.sql.
      - run: bash scripts/verify-migrations-manifest.sh
      - run: bash scripts/verify-migrations-manifest.test.sh
      # GATE-DIRECT-SUPABASE / INV-NETWORK-COMPLETE: los clientes solo hablan con el backend (y GoTrue token/logout desde AuthApi.kt); el
      # egreso HTTP queda fijado por ops/inventory/direct-supabase-allowlist.tsv. Los manifiestos de rutas los verifica `:backend:ktor:test`.
      - run: bash scripts/verify-no-direct-supabase.sh
      - run: bash scripts/verify-no-direct-supabase.test.sh
      # CI-JVMTEST-COVERAGE: todo modulo con src/jvmTest|commonTest debe estar en la linea de pruebas del job `tests`, en la lista
      # de verificacion de dependencias y en DEPLOYMENT.md (:core:common:jvmTest no corria en CI).
      - run: bash scripts/verify-ci-jvmtest-coverage.sh
      - run: bash scripts/verify-ci-jvmtest-coverage.test.sh
  # MASTER-SEC-014 / MASTER2-CICD-001: SCA del grafo RESUELTO de runtimeClasspath (BOMs, alias del catalogo y transitivas)
  # contra OSV; falla si el arbol no se puede interpretar o OSV no responde (sin secretos, sin dependencias nuevas).
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: gradle/actions/wrapper-validation@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
      - run: node --test scripts/osv-audit.test.mjs
      - run: ./gradlew :backend:ktor:dependencies --configuration runtimeClasspath -q > "$RUNNER_TEMP/runtime-deps.txt"
      # CI-OC-DEPS: tambien el cliente admin (JVM). releaseRuntimeClasspath (Android) queda como seguimiento; las klibs de iOS
      # no son coordenadas Maven que OSV pueda resolver (fuera de alcance).
      - run: ./gradlew :composeApp:dependencies --configuration jvmRuntimeClasspath -q > "$RUNNER_TEMP/admin-jvm-deps.txt"
      # MASTER3-CICD-008: el self-test depende de api.osv.dev en vivo (flake); es informativo y NO bloquea. La auditoria real
      # de la linea siguiente sigue siendo fail-closed y el parser tiene su prueba unitaria sin red arriba.
      - run: node scripts/osv-audit.mjs --self-test
        continue-on-error: true
      - run: node scripts/osv-audit.mjs "$RUNNER_TEMP/runtime-deps.txt" "$RUNNER_TEMP/admin-jvm-deps.txt"
  openapi-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      # MASTER7-CICD-005: @redocly/cli y su arbol quedan fijados por tools/redocly/package-lock.json (`npm ci` falla si no coincide).
      - run: npm ci --prefix tools/redocly --ignore-scripts
      - run: npx --no-install --prefix tools/redocly redocly lint openapi/root.yaml --config openapi/redocly.yaml
  # MASTER7-CICD-001: deteccion de secretos en el historial (solo verificacion; paridad con OposiBot). Accion fijada por el SHA del
  # tag v2.3.9. Usa solo el GITHUB_TOKEN automatico del run (sin secretos del repositorio); si el repositorio pasa a ser de una
  # organizacion, la accion exige ademas GITLEAKS_LICENSE (ajuste externo, no incluido aqui).
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false, fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  # MASTER7-CICD-002: la imagen del backend se construye y ARRANCA en CI (solo verificacion: sin secretos, sin push ni despliegue).
  # build-backend-image.sh exige arbol limpio (no generar archivos antes); el humo comprueba uid 10001, /app no escribible y
  # /health/live = 200 con variables de relleno.
  backend-image:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: gradle/actions/wrapper-validation@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
      - run: bash scripts/build-backend-image.sh
      - run: bash scripts/smoke-backend-image.sh
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: gradle/actions/wrapper-validation@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
      - run: ./gradlew :backend:ktor:test :backend:dbtest:test :composeApp:compileKotlinJvm :data:jvmTest :domain:jvmTest :features:users:jvmTest :features:reports:jvmTest :core:database:jvmTest :composeApp:jvmTest :core:common:jvmTest :core:network:jvmTest :core:ui:jvmTest :features:analytics:jvmTest :features:audit:jvmTest :features:auth:jvmTest :features:dashboard:jvmTest :features:exam-access:jvmTest :features:exams:jvmTest :features:forum:jvmTest :features:imports:jvmTest :features:news:jvmTest :features:opositester:jvmTest :features:questions:jvmTest :features:rankings:jvmTest :features:settings:jvmTest :features:specialties:jvmTest :features:store:jvmTest :features:tickets:jvmTest :features:support:jvmTest --rerun-tasks --no-build-cache -Pci.quarantine=true
      # SEC-001: las pruebas de permisos 0700/0600 llevan Assume (se saltan en Windows); aqui, en Linux, deben EJECUTARSE y
      # pasar: un salto silencioso (p. ej. un FileStore sin vista posix) hace fallar el job en vez de contar como verde.
      - run: |
          bash scripts/assert-junit-executed.test.sh
          r=core/database/build/test-results/jvmTest
          bash scripts/assert-junit-executed.sh "$r/TEST-com.oposicontrol.admin.core.database.DatabaseHardeningJvmTest.xml" 'databaseAndDirectoryAreOwnerOnlyOnPosix[jvm]'
          bash scripts/assert-junit-executed.sh "$r/TEST-com.oposicontrol.admin.core.database.DatabaseDriverFactoryJvmTest.xml" 'migrationLeavesTheDirectoryAndCopyOwnerOnlyOnPosix[jvm]'
      # CI-GRADLE-VERIF: deriva de gradle/verification-metadata.xml en Linux. Regenera sobre el grafo de los TRES jobs Gradle
      # (dependency-audit, backend-image y tests; misma lista que docs/engineering/DEPLOYMENT.md) y exige diff vacio: un
      # artefacto que falte o un sha256 distinto hace fallar el job (la verificacion estricta de los pasos previos ya falla
      # con "Dependency verification failed"; esto nombra el hueco exacto en el diff).
      - run: ./gradlew --no-configuration-cache --write-verification-metadata sha256 :backend:ktor:dependencies --configuration runtimeClasspath :composeApp:dependencies --configuration jvmRuntimeClasspath :backend:ktor:installDist :backend:ktor:test :backend:dbtest:test :composeApp:compileKotlinJvm :data:jvmTest :domain:jvmTest :features:users:jvmTest :features:reports:jvmTest :core:database:jvmTest :composeApp:jvmTest :core:common:jvmTest :core:network:jvmTest :core:ui:jvmTest :features:analytics:jvmTest :features:audit:jvmTest :features:auth:jvmTest :features:dashboard:jvmTest :features:exam-access:jvmTest :features:exams:jvmTest :features:forum:jvmTest :features:imports:jvmTest :features:news:jvmTest :features:opositester:jvmTest :features:questions:jvmTest :features:rankings:jvmTest :features:settings:jvmTest :features:specialties:jvmTest :features:store:jvmTest :features:tickets:jvmTest :features:support:jvmTest -Pci.quarantine=true
      - run: git diff --exit-code -- gradle/verification-metadata.xml
      # CI-GRADLE-VERIF: control negativo funcional del paso anterior (copia temporal: sha256 corrupto / componente quitado => el diff debe FALLAR).
      - run: bash scripts/verify-gradle-drift-negative-control.sh
      # INV-NETWORK-COMPLETE: los flavors Android staging/prod hornean SUPABASE_URL del entorno y el BUILD falla si falta o no es https.
      - run: bash scripts/verify-android-flavor-config.sh
  # DB-CI-PG17: migraciones pendientes (supabase/baseline/PENDING_MIGRATIONS.txt) sobre PostgreSQL 17 REAL (imagen de Supabase
  # fijada por digest) cargado con la forma de MAIN que tocan (supabase/baseline/main_shape_subset.sql, sin filas), ON_ERROR_STOP,
  # VERIFY = 0 tras cada una, assertions.sql (comportamiento + grants/RLS) y rollback inverso/re-aplicacion por huella de catalogo.
  # Despues el control negativo: mutaciones sembradas que DEBEN fallar. Sin secretos ni MAIN; el gate local completo sigue siendo
  # el mas fuerte (cobertura y limites en supabase/baseline/README.md).
  db-pg17:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      - run: node --test scripts/db-pg17-bootstrap-extract.test.mjs
      # El registro publico limita por IP compartida (toomanyrequests): reintento acotado con espera; sigue fallando si no baja.
      - run: for i in 1 2 3 4 5 6; do docker pull public.ecr.aws/supabase/postgres@sha256:658d1c9b09ae4f61b8e95087b6859181b4b7d6940d769cf7b605609c8aad43e9 && exit 0; sleep $((i * 20)); done; exit 1
      - run: bash scripts/db-pg17-gate.sh
      - run: bash scripts/db-pg17-gate.test.sh
  # CI-OC-RELEASE: la distribucion de escritorio (jlink + jpackage app-image, sin WiX ni dpkg) se construye con la configuracion
  # release y su runtime embebido debe traer java.sql/java.management/java.instrument/jdk.unsupported/jdk.crypto.ec (sin java.sql
  # la MSI fallaba al arrancar). Solo verificacion: sin firma, sin secretos, sin publicar artefactos.
  desktop-release-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: gradle/actions/wrapper-validation@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
      - run: bash scripts/verify-desktop-runtime-modules.test.sh
      # La distribucion PROD exige SUPABASE_URL https (verifyNonDevSupabaseConfig falla el build si falta). Aqui solo se verifica el
      # empaquetado (sin firma ni publicacion): URL publica NO secreta de relleno; el valor real lo aporta el entorno de release.
      - run: ./gradlew :composeApp:createDistributable -PoposiProduction=true --console=plain
        env:
          SUPABASE_URL: https://ci-distribution-check.supabase.co
      - run: bash scripts/verify-desktop-runtime-modules.sh
